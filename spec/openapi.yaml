                      pages: [1, 2, 3]
                      credits: 3
                      renderId: clx8n0q1r0005abcd1234efgh
                      responseTime: 4210
                everySize:
                  summary: Several sizes (response.sizes)
                  value:
                    data:
                      content:
                        - size: original
                          name: Original
                          width: 1080
                          height: 1350
