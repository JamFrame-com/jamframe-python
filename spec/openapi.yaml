                  workflow: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Workflows]
      operationId: updateWorkflow
      summary: Change a workflow
      description: |
        Fields sent replace the old ones. `status: active` needs a complete
        definition whose template, social accounts and Google accounts
        exist in the workspace; otherwise 400 with `detail.problems`.
        Activating a scheduled workflow sets `nextRunAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowUpdate' }
            example: { status: active }
      responses:
        '200':
          description: The workflow after the change.
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Workflows]
      operationId: deleteWorkflow
      summary: Delete a workflow
      description: Deletes the workflow and its run history. Renders and posts it made stay.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /workflows/{id}/run:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: runWorkflow
      summary: Run a workflow
      description: |
        Queues a run now (drafts included). Each row renders the template
        (render credits) and goes to the deliveries. Answers 202 with the
        run; poll `GET /workflows/{id}/runs/{runId}`. Refused with 402 when
        the plan's runs this month or the render credits are used up, and
        with `503 VIDEO_UNAVAILABLE` when the workflow renders MP4 and
        video rendering is turned off.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowRunRequest' }
            example: { maxRows: 1 }
      responses:
        '202':
          description: The queued run.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: '#/components/schemas/WorkflowRun' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/VideoUnavailable' }

  /workflows/{id}/webhook-token:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      tags: [Workflows]
      operationId: rotateWorkflowWebhook
      summary: Get a new incoming webhook URL
      description: For workflows with the incoming webhook trigger. The old URL stops working at once.
      responses:
        '200':
          description: The new URL.
          content:
            application/json:
              schema:
                type: object
                required: [webhookUrl]
                properties:
                  webhookUrl: { type: string, format: uri }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /workflows/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: listWorkflowRuns
      summary: List a workflow's runs
      description: Newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs, pagination]
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowRun' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /workflows/{id}/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowRunId'
    get:
      tags: [Workflows]
      operationId: getWorkflowRun
      summary: Get a run with each row's result
      responses:
        '200':
          description: The run and its rows (at most 1,000).
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    allOf:
                      - $ref: '#/components/schemas/WorkflowRun'
                      - type: object
                        required: [rows]
                        properties:
                          rows:
                            type: array
                            items: { $ref: '#/components/schemas/WorkflowRunRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /workflows/{id}/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/WorkflowRunId'
    post:
      tags: [Workflows]
      operationId: cancelWorkflowRun
      summary: Cancel a run
      description: Cancels a queued or running run. Rows not started yet are skipped; the row in progress finishes.
      responses:
        '200':
          description: The run after canceling.
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: '#/components/schemas/WorkflowRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The run already finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: CONFLICT, message: The run already finished (succeeded) }
        '429': { $ref: '#/components/responses/RateLimited' }

webhooks:
  designEvent:
    post:
      tags: [Webhooks]
      operationId: onDesignEvent
      summary: Design event delivery
      description: |
        What JamFrame POSTs to a subscription's URL when a subscribed
        `design.*` event happens (`data` is a `Design`). Respond with any
        2xx within 10 seconds; anything else is retried (see "Outbound
        webhooks" in the introduction).
      security: []
      parameters:
        - in: header
          name: X-Webhook-Event
          required: true
          description: The event type.
          schema: { $ref: '#/components/schemas/WebhookEventType' }
        - in: header
          name: X-Webhook-Delivery
          required: true
          description: Delivery id, unchanged across retries. Use it to deduplicate.
          schema: { type: string }
        - in: header
          name: X-Webhook-Timestamp
          required: true
          description: Unix seconds when this attempt was signed.
          schema: { type: string }
        - in: header
          name: X-Webhook-Signature
          required: true
          description: '`t=<unixSeconds>,v1=<hex HMAC-SHA256 of "${t}.${rawBody}">`'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Any 2xx acknowledges the delivery.
        '410':
          description: Gone. JamFrame deletes the subscription and stops delivering.
  renderEvent:
    post:
      tags: [Webhooks]
      operationId: onRenderEvent
      summary: Render job event delivery
      description: |
        What JamFrame POSTs to a subscription's URL when a render job in
        the workspace ends: `render.completed` or `render.failed`, with the
        render job as `data`. Signed, retried and deduplicated exactly like
        design events. Synchronous image and PDF renders don't send events.

        The job's file links are signed when the event is sent and work for
        the render's `expiresIn` (default 5 minutes) from then. A delivery
        retried after that carries links that no longer work: fetch the job
        (`GET /render-jobs/{id}`) for fresh ones.
      security: []
      parameters:
        - in: header
          name: X-Webhook-Event
          required: true
          description: '`render.completed` or `render.failed`.'
          schema: { $ref: '#/components/schemas/WebhookEventType' }
        - in: header
          name: X-Webhook-Delivery
          required: true
          description: Delivery id, unchanged across retries. Use it to deduplicate.
          schema: { type: string }
        - in: header
          name: X-Webhook-Timestamp
          required: true
          description: Unix seconds when this attempt was signed.
          schema: { type: string }
        - in: header
          name: X-Webhook-Signature
          required: true
          description: '`t=<unixSeconds>,v1=<hex HMAC-SHA256 of "${t}.${rawBody}">`'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
            example:
              id: whe_sAYiZY7DgQIEBq1zO8tip_np
              type: render.completed
              createdAt: '2026-11-09T12:38:50.201Z'
              data:
                id: clx8n0q1r0008abcd1234efgh
                status: succeeded
                progress: 1
                format: mp4
                templateId: clx8m2k3p0004abcd1234efgh
                createdAt: '2026-11-09T12:38:36.161Z'
                startedAt: '2026-11-09T12:38:36.165Z'
                finishedAt: '2026-11-09T12:38:50.188Z'
                result:
                  content: https://cdn.jamframe.com/renders/ws_abc123/c724edf3-728c-4b57-8c31-4c2c0348ae6d.mp4?Expires=1794228230&Key-Pair-Id=K2JCJMDEHXQW5F&Signature=Yq0nRZ3x~Gd5WQ__
                  expiresAt: '2026-11-09T12:43:50.000Z'
                  type: url
                  format: mp4
                  pages: [1, 2]
                  credits: 13
                  renderId: clx8n0q1r0009abcd1234efgh
                  responseTime: 14023
                  duration: 13
                error: null
      responses:
        '200':
          description: Any 2xx acknowledges the delivery.
        '410':
          description: Gone. JamFrame deletes the subscription and stops delivering.
  socialEvent:
    post:
      tags: [Webhooks]
      operationId: onSocialEvent
      summary: Social post event delivery
      description: |
        What JamFrame POSTs to a subscription's URL each time one account
        of a social post finishes: `social.post.published` (with its
        permalink) or `social.post.failed` (after retries, with the
        reason). `data` carries the whole post and that account's target.
        Signed, retried and deduplicated like the other events.
      security: []
      parameters:
        - in: header
          name: X-Webhook-Event
          required: true
          description: '`social.post.published` or `social.post.failed`.'
          schema: { $ref: '#/components/schemas/WebhookEventType' }
        - in: header
          name: X-Webhook-Delivery
          required: true
          description: Delivery id, unchanged across retries. Use it to deduplicate.
          schema: { type: string }
        - in: header
          name: X-Webhook-Timestamp
          required: true
          description: Unix seconds when this attempt was signed.
          schema: { type: string }
        - in: header
          name: X-Webhook-Signature
          required: true
          description: '`t=<unixSeconds>,v1=<hex HMAC-SHA256 of "${t}.${rawBody}">`'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Any 2xx acknowledges the delivery.
        '410':
          description: Gone. JamFrame deletes the subscription and stops delivering.
  workflowEvent:
    post:
      tags: [Webhooks]
      operationId: onWorkflowEvent
      summary: Workflow run event delivery
      description: |
        What JamFrame POSTs to a subscription's URL when a workflow run
        ends: `workflow.run.completed` (it succeeded, or some rows failed:
        see `status`) or `workflow.run.failed`. `data` is the run summary
        (`WorkflowRunEvent`). Signed, retried and deduplicated like the
        other events.
      security: []
      parameters:
        - in: header
          name: X-Webhook-Event
          required: true
          description: The event type.
          schema: { $ref: '#/components/schemas/WebhookEventType' }
        - in: header
          name: X-Webhook-Delivery
          required: true
          description: Delivery id, unchanged across retries. Use it to deduplicate.
          schema: { type: string }
        - in: header
          name: X-Webhook-Timestamp
          required: true
          description: Unix seconds when this attempt was signed.
          schema: { type: string }
        - in: header
          name: X-Webhook-Signature
          required: true
          description: '`t=<unixSeconds>,v1=<hex HMAC-SHA256 of "${t}.${rawBody}">`'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Any 2xx acknowledges the delivery.
        '410':
          description: Gone. JamFrame deletes the subscription and stops delivering.
  renderJobCallback:
    post:
      tags: [Render]
      operationId: onRenderJobCallback
      summary: Render job callback (webhookUrl)
      description: |
        What JamFrame POSTs to a render request's `webhookUrl` when its
        job ends. Respond with any 2xx within 10 seconds. A network error,
        timeout, 408, 429 or 5xx is retried twice (after 5 and 30 seconds);
        other answers are final. The job's file links are signed when the
        job ends and work for the request's `expiresIn` from then.

        The callback is **not signed** (a per-request URL has no shared
        secret). Treat it as a hint: to trust the result, fetch the job with
        your API key (`GET /render-jobs/{id}`), or put an unguessable token
        in the `webhookUrl`.
      security: []
      parameters:
        - in: header
          name: X-Webhook-Event
          required: true
          description: '`render.completed` or `render.failed`, as in the body.'
          schema: { type: string, enum: [render.completed, render.failed] }
        - in: header
          name: X-Render-Job
          required: true
          description: The render job id.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderJobCallback' }
      responses:
        '200':
          description: Any 2xx acknowledges the callback.
  designGenerateCallback:
    post:
      tags: [AI]
      operationId: onDesignGenerateCallback
      summary: AI design job callback (webhookUrl)
      description: |
        What JamFrame POSTs to a `POST /designs/generate` request's
        `webhookUrl` when its job ends. Same rules as the render job
        callback: respond with any 2xx within 10 seconds; a network error,
        timeout, 408, 429 or 5xx is retried twice (after 5 and 30 seconds).

        The callback is **not signed**. To trust the result, fetch the job
        with your API key (`GET /designs/generate/{jobId}`).
      security: []
      parameters:
        - in: header
          name: X-Webhook-Event
          required: true
          description: '`design.generate.completed` or `design.generate.failed`, as in the body.'
          schema: { type: string, enum: [design.generate.completed, design.generate.failed] }
        - in: header
          name: X-Design-Job
          required: true
          description: The job id.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignGenerateCallback' }
      responses:
        '200':
          description: Any 2xx acknowledges the callback.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: jf_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      description: Bearer API key created on the web app's API Keys page.

  parameters:
    AnalyticsFrom:
      name: from
      in: query
      required: false
      description: First day of the range (YYYY-MM-DD, in the organization's analytics time zone). Default 27 days before `to`.
      schema: { type: string, format: date, example: '2026-10-14' }
    AnalyticsTo:
      name: to
      in: query
      required: false
      description: Last day of the range, included. Default today. A range is at most 366 days.
      schema: { type: string, format: date, example: '2026-11-10' }
    AnalyticsPlatform:
      name: platform
      in: query
      required: false
      description: Only these platforms, comma-separated (or the parameter repeated).
      schema: { type: string, example: 'instagram,x' }
    AnalyticsAccountId:
      name: accountId
      in: query
      required: false
      description: Only these accounts (ids from `GET /social/accounts`), comma-separated (or repeated).
      schema: { type: string }
    FormPublicId:
      in: path
      name: publicId
      required: true
      description: The form's public id (the last part of its `/f/<publicId>` link).
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
      description: |
        Opaque cursor returned in the previous response's
        `pagination.nextCursor`. Omit to start from the first page.
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size (clamped to 100).
    SubscriptionId:
      in: path
      name: id
      required: true
      description: The webhook subscription id.
      schema: { type: string }

    SocialPostId:
      in: path
      name: id
      required: true
      description: A social post id.
      schema: { type: string, maxLength: 64 }
    WorkflowId:
      name: id
      in: path
      required: true
      description: The workflow's id.
      schema: { type: string, maxLength: 64 }
    WorkflowRunId:
      name: runId
      in: path
      required: true
      description: The run's id.
      schema: { type: string, maxLength: 64 }
  schemas:
    SocialMetricValues:
      type: object
      description: |
        Metrics; `null` when the platform doesn't report one. `impressions`
        holds impressions or views, whichever the platform reports;
        `engagement` is likes + comments + shares + saves of those known.
      required: [impressions, reach, likes, comments, shares, saves, clicks, engagement]
      properties:
        impressions: { type: [number, 'null'] }
        reach: { type: [number, 'null'] }
        likes: { type: [number, 'null'] }
        comments: { type: [number, 'null'] }
        shares: { type: [number, 'null'] }
        saves: { type: [number, 'null'] }
        clicks: { type: [number, 'null'] }
        engagement: { type: [number, 'null'] }
    SocialMetricName:
      type: string
      enum: [impressions, reach, likes, comments, shares, saves, clicks, engagement]
    SocialAnalyticsRange:
      type: object
      required: [from, to, days, timezone, historyDays, limited]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer }
        timezone: { type: string, description: 'The organization''s analytics time zone (UTC when unset).' }
        historyDays: { type: integer, description: 'Days of history the plan keeps.' }
        limited: { type: boolean, description: 'The range asked for started before the plan''s history; `from` was moved up.' }
    SocialAnalyticsOverview:
      type: object
      required: [range, previousRange, available, totals, previous, change, engagementRate, postsPublished, previousPostsPublished]
      properties:
        range: { $ref: '#/components/schemas/SocialAnalyticsRange' }
        previousRange:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        available:
          type: array
          description: The metrics the platforms in scope report.
          items: { $ref: '#/components/schemas/SocialMetricName' }
        totals: { $ref: '#/components/schemas/SocialMetricValues' }
        previous: { $ref: '#/components/schemas/SocialMetricValues' }
        change:
          description: Percent change from `previous` to `totals`; null when there is no earlier number.
          allOf: [{ $ref: '#/components/schemas/SocialMetricValues' }]
        engagementRate: { type: [number, 'null'], description: 'Engagement ÷ impressions, in percent.' }
        postsPublished: { type: integer }
        previousPostsPublished: { type: integer }
    SocialAnalyticsDaily:
      type: object
      required: [range, available, days]
      properties:
        range: { $ref: '#/components/schemas/SocialAnalyticsRange' }
        available:
          type: array
          items: { $ref: '#/components/schemas/SocialMetricName' }
        days:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/SocialMetricValues' }
              - type: object
                required: [day, postsPublished]
                properties:
                  day: { type: string, format: date }
                  postsPublished: { type: integer }
    SocialPostMetrics:
      type: object
      description: One post on one account and its lifetime numbers so far.
      required: [id, accountId, accountName, platform, externalId, origin, caption, publishedAt, metrics, status]
      properties:
        id: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        platform: { $ref: '#/components/schemas/SocialPlatform' }
        platformName: { type: string }
        externalId: { type: string, description: 'The platform''s post id.' }
        postId: { type: [string, 'null'], description: 'The post (`GET /social/posts/{id}`) when it was made here.' }
        origin: { type: string, enum: [app, imported] }
        permalink: { type: [string, 'null'] }
        caption: { type: string }
        mediaType: { type: [string, 'null'], example: image }
        thumbnailUrl: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
        metrics: { $ref: '#/components/schemas/SocialMetricValues' }
        engagementRate: { type: [number, 'null'] }
        status:
          type: string
          enum: [active, done, unavailable, gone]
          description: '`done`: past 90 days, no longer refreshed; `unavailable`: the platform gives no numbers for it (`statusReason`); `gone`: deleted at the platform.'
        statusReason: { type: [string, 'null'] }
        lastFetchedAt: { type: [string, 'null'], format: date-time }
    SocialAnalyticsInsights:
      type: object
      required: [range, topPosts, bestTimes, platforms]
      properties:
        range: { $ref: '#/components/schemas/SocialAnalyticsRange' }
        topPosts:
          type: array
          items: { $ref: '#/components/schemas/SocialPostMetrics' }
        bestTimes:
          type: object
          required: [basedOnPosts, enoughData, metric, timezone, weekdays, hours, bestWeekday, bestHour]
          properties:
            basedOnPosts: { type: integer }
            enoughData: { type: boolean, description: 'At least 5 posts with numbers.' }
            metric: { type: string, enum: [engagement, impressions] }
            timezone: { type: string }
            weekdays:
              type: array
              description: Sunday (0) to Saturday (6).
              items:
                type: object
                properties:
                  weekday: { type: integer }
                  name: { type: string }
                  posts: { type: integer }
                  average: { type: [number, 'null'] }
            hours:
              type: array
              description: 0 to 23.
              items:
                type: object
                properties:
                  hour: { type: integer }
                  posts: { type: integer }
                  average: { type: [number, 'null'] }
            bestWeekday:
              type: [object, 'null']
              properties:
                weekday: { type: integer }
                name: { type: string }
            bestHour: { type: [integer, 'null'] }
        platforms:
          type: array
          items:
            type: object
            properties:
              platform: { $ref: '#/components/schemas/SocialPlatform' }
              platformName: { type: string }
              posts: { type: integer }
              totals: { $ref: '#/components/schemas/SocialMetricValues' }
              averages: { $ref: '#/components/schemas/SocialMetricValues' }
              engagementRate: { type: [number, 'null'] }
    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: |
            Stable, machine-readable error code. `INVALID_REQUEST` (400) is a
            body that isn't valid JSON, `BODY_TOO_LARGE` (413) a body over
            5 MB, and `UNSUPPORTED_MEDIA_TYPE` (415) a body in a charset or
            encoding the API can't read.
          enum:
            - MISSING_API_KEY
            - INVALID_API_KEY
            - EXPIRED_API_KEY
            - ORG_ON_HOLD
            - ORG_SUSPENDED
            - RATE_LIMITED
            - VALIDATION_ERROR
            - INVALID_REQUEST
            - BODY_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - NOT_FOUND
            - CONFLICT
            - QUOTA_EXCEEDED
            - WORKSPACE_QUOTA_EXCEEDED
            - PLAN_LIMIT_EXCEEDED
            - WEBHOOK_URL_INVALID
            - WEBHOOK_LIMIT_REACHED
            - VIDEO_UNAVAILABLE
            - AI_UNAVAILABLE
            - AI_CONTENT_REFUSED
            - AI_TIMEOUT
            - AI_RATE_LIMITED
            - AI_BAD_OUTPUT
            - AI_BAD_REQUEST
            - AI_UPSTREAM_ERROR
            - AI_CREDITS_EXCEEDED
            - INTERNAL
        message:
          type: string
          description: Human-readable error message, safe to show to end users.
        detail:
          type: object
          description: Optional structured context (varies by error code).
          additionalProperties: true

    AuthResult:
      type: object
      required: [username]
      properties:
        workspaceId:
          type: string
          description: |
            Stable identifier of the workspace the API key is bound to.
            Suitable as a connection UID for integration platforms
            (e.g. Make) since it doesn't change when the owner is renamed.
        username:
          type: string
          description: |
            Display name of the organization owner. Falls back to the
            owner's email when no name is set. Safe to show as a Zapier
            connection label.

    AiStatus:
      type: object
      required: [status, models, prices, credits]
      properties:
        status:
          type: string
          enum: [live, mock, off]
          description: |
            `live`: AI runs. `mock`: a development server without an AI key
            answers with placeholder output (no cost). `off`: AI features
            answer `503 AI_UNAVAILABLE`.
        models:
          type: object
          description: The model slug each AI task uses (design, fast, vision, image, imageEdit, background, tts, stt, video, embedding).
          additionalProperties: { type: string }
        prices:
          type: array
          description: The AI credit price list. An operation costs `credits` per started block of `per` units.
          items:
            type: object
            required: [operation, credits, per, unit, label]
            properties:
              operation:
                type: string
                enum: [text, design, vision, image, image_hd, background_local, background_model, tts, stt, video, embedding]
              credits: { type: integer }
              per: { type: integer }
              unit:
                type: string
                enum: [word, call, image, character, second, input]
              label: { type: string }
        credits:
          type: object
          description: The organization's AI credits for the current billing period.
          required: [planCode, used, reserved, limit, remaining, periodStart, periodEnd, active]
          properties:
            planCode: { type: string }
            used:
              type: integer
              description: Credits charged this period.
            reserved:
              type: integer
              description: Credits held by AI calls still running.
            limit:
              type: [integer, 'null']
              description: The period's allowance; `null` means unlimited.
            remaining:
              type: [integer, 'null']
              description: What can still be spent; `null` means unlimited.
            periodStart: { type: string, format: date-time }
            periodEnd: { type: string, format: date-time }
            active:
              type: boolean
              description: False when the subscription isn't active (AI credits can't be spent).

    Pagination:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
          description: |
            Pass this as `?cursor=` to fetch the next page. `null` on the
            last page.
        hasMore:
          type: boolean
          description: True when more pages remain.

    Design:
      type: object
      description: Template summary. Also the `data` of every `design.*` webhook event.
      required: [id, name, orientation, pages, animated, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        orientation:
          type: string
          enum: [landscape, portrait, square]
          description: Derived from the first page's canvas size.
        pages:
          type: integer
          minimum: 0
          description: |
            Number of pages in the template (1 for a single image, more for
            a carousel; each page is a scene of a video). 0 only for a
            template that can't be read, which fails to render.
        animated:
          type: boolean
          description: |
            A video template: a page has animated layers, a video layer, a
            set duration or a transition into the next page, or the template
            has a soundtrack. Render it with `response.format: "mp4"` to see
            the motion; image and PDF formats show it still.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DesignDetail:
      allOf:
        - $ref: '#/components/schemas/Design'
        - type: object
          required: [parameters, sizes]
          properties:
            parameters:
              type: array
              description: Everything a render's `modifications` can set by plain key.
              items: { $ref: '#/components/schemas/TemplateParameter' }
            sizes:
              type: array
              description: |
                Smart Resize sizes saved on the template (the editor's Resize
                tab). Pass an `id` as `response.size` to render that size with
                its manual adjustments. Any other size can be rendered too.
              items: { $ref: '#/components/schemas/TemplateSize' }

    DesignGenerateRequest:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt:
          type: string
          maxLength: 4000
          description: What to design (purpose, content, audience, style). Also the design's name unless `name` is given.
        size:
          type: string
          description: |
            A size preset id (`instagram-post`, `instagram-portrait`,
            `instagram-story`, `linkedin-post`, `linkedin-carousel`,
            `youtube-thumbnail`, `og-image`, `a4-portrait`…), a short alias
            (`square`, `portrait`, `story`, `landscape`) or `WIDTHxHEIGHT`.
            Default 1080x1350. Or send `width` and `height`.
          example: instagram-story
        width: { type: integer, minimum: 16, maximum: 10000 }
        height: { type: integer, minimum: 16, maximum: 10000 }
        pages:
          type: integer
          minimum: 1
          maximum: 10
          description: Pages to design (a carousel). Default 1.
        video:
          type: boolean
          description: Make an animated video template (page durations, transitions, enter animations); render it as `mp4`.
        brand:
          description: |
            `true` (default): the workspace's brand library (colours, fonts,
            logo); `false`: no brand; or explicit values. Fonts must be
            brand-library fonts or Google fonts the editor offers.
          oneOf:
            - type: boolean
            - type: object
              additionalProperties: false
              properties:
                colors: { type: array, maxItems: 12, items: { type: string, example: '#0b1f4d' }, description: 'Hex colours, primary first.' }
                fonts: { type: array, maxItems: 4, items: { type: string, example: Poppins }, description: 'Font families, heading first.' }
                logo: { type: string, description: A brand-library image URL or any https image URL. }
        referenceImageUrl:
          type: string
          description: A public https PNG, JPEG, GIF or WebP to recreate or take inspiration from (a screenshot, a mood board).
        name: { type: string, maxLength: 120, description: The design's name. }
        async:
          type: boolean
          description: Answer `202` with the job at once instead of waiting.
        webhookUrl:
          type: string
          format: uri
          maxLength: 2048
          description: |
            With `"async": true`: POSTed `{ event, job }` when the job ends
            (see the `designGenerateCallback` webhook). Public http(s) URLs
            only (`WEBHOOK_URL_INVALID` otherwise).

    DesignGenerateJob:
      type: object
      required: [jobId, status, createdAt]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        design:
          description: The saved design (succeeded).
          allOf:
            - $ref: '#/components/schemas/DesignDetail'
            - type: object
              properties:
                editorUrl: { type: string, description: Opens the design in the editor. }
        message: { type: string, description: The design agent's summary of what it made. }
        changes: { type: array, items: { type: string }, description: 'The changes it made, one line each.' }
        creditsCharged: { type: integer, description: AI credits charged (5). }
        mock: { type: boolean, description: Made by the development server's scripted designer (no AI key). }
        error:
          description: The error envelope (failed).
          $ref: '#/components/schemas/ApiError'
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    TemplateSize:
      type: object
      required: [id, name, width, height]
      properties:
        id:
          type: string
          description: The value for `response.size`, e.g. `story`.
        name: { type: string }
        width: { type: integer, minimum: 16, maximum: 10000 }
        height: { type: integer, minimum: 16, maximum: 10000 }

    TemplateParameter:
      type: object
      required: [key, type, pages, example]
      properties:
        key:
          type: string
          description: The modification key, e.g. `title`.
        type:
          type: string
          enum: [text, image, qr, shape, video, audio, subtitles, variable]
          description: |
            What the value sets: `text` → the layer's text, `image` → the
            image URL, `qr` → the encoded value, `shape` → the fill colour,
            `video` → the video clip URL, `audio` → the template's audio
            track URL (listed when the template has one; it plays across
            every page), `subtitles` → the video's subtitles (listed when
            the template has some; `example` is the first cue's text),
            `variable` → a `{{placeholder}}` inside text.
        pages:
          type: array
          items: { type: integer, minimum: 1 }
          description: Pages (from 1) on which this parameter appears.
        example:
          type: string
          description: The value currently in the template.
        prompt:
          type: string
          description: |
            Layers filled by AI at render time: their prompt. Send
            `<key>.prompt` to change it, or a plain value to skip the AI;
            `example` is then the layer's saved text or image. `{{name}}`
            placeholders in it are parameters of the render too.

    FigmaImportInfo:
      type: object
      required: [workspace, organization, appUrl, format, formatVersion, limits]
      properties:
        workspace:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        organization:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        appUrl:
          type: string
          description: The app's origin (the editor lives at `<appUrl>/designs/<id>/edit`).
        format: { type: string, enum: [figma-import] }
        formatVersion: { type: integer, enum: [1] }
        limits:
          type: object
          description: What one import may carry (bytes, counts, px).
          additionalProperties: { type: integer }
          example:
            maxFrames: 20
            maxLayersPerFrame: 1000
            maxLayers: 5000
            maxAssets: 300
            maxAssetBytes: 10485760
            maxSvgBytes: 5242880
            maxThumbnailBytes: 1048576
            maxTotalBytes: 62914560
            maxDocumentBytes: 4194304
            maxJsonBodyBytes: 5242880
            maxTextLength: 20000
            maxCanvasSide: 10000

    FigmaImportDocument:
      type: object
      description: |
        What the Figma plugin exports. Coordinates are px in the frame; a
        layer's box is unrotated and `rotation` turns it clockwise around
        its centre. Layers are listed bottom to top. The complete schema is
        `server/src/lib/figmaImport/format.ts`; the plugin's fixtures
        (`integrations/figma-plugin/fixtures/*.json`) are full examples.
      required: [format, version, frames, assets]
      properties:
        format: { type: string, enum: [figma-import] }
        version: { type: integer, enum: [1] }
        name:
          type: string
          maxLength: 200
          description: Template name (`pages` mode; default the first frame's name).
        mode:
          type: string
          enum: [pages, separate]
          default: pages
        source:
          type: object
          properties:
            fileName: { type: string }
            fileKey: { type: [string, 'null'] }
            pageName: { type: string }
            pluginVersion: { type: string }
        options:
          type: object
          properties:
            importFonts:
              type: boolean
              default: true
              description: Add Google Fonts that aren't built in to the brand library.
        frames:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/FigmaImportFrame' }
        assets:
          type: array
          maxItems: 300
          items:
            type: object
            required: [id, mime]
            properties:
              id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
              mime: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp, image/svg+xml] }
              name: { type: string, description: The name it gets in the brand library. }
              role: { type: string, enum: [layer, thumbnail] }
              data: { type: string, format: byte, description: 'Base64 bytes (JSON requests only).' }
        warnings:
          type: array
          description: Notes from the plugin, passed through to the result.
          items: { $ref: '#/components/schemas/FigmaImportWarning' }

    FigmaImportFrame:
      type: object
      required: [id, name, width, height, background, layers]
      properties:
        id: { type: string, description: Figma node id. }
        name: { type: string }
        width: { type: number, minimum: 1, maximum: 10000 }
        height: { type: number, minimum: 1, maximum: 10000 }
        background:
          type: [string, 'null']
          description: '`#rrggbb`; null for none (white).'
        thumbnail:
          type: string
          description: Asset id of a small preview, stored as the design's thumbnail.
        layers:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/FigmaImportLayer' }

    FigmaImportLayer:
      type: object
      description: |
        One layer. Common fields below; by `type`:
        `text`: `text`, `runs` (style runs: `start`, `end`, `fontFamily`,
        `fontStyle`, `fontWeight`, `italic`, `fontSize`, `lineHeight`,
        `letterSpacing`, `color`, `textCase`, `decoration`), `align`,
        `verticalAlign`, `autoResize`, `inkBounds`;
        `rectangle`, `ellipse`, `line`, `triangle`: `fill`, `stroke`,
        `strokeWidth`, `strokeAlign`, `strokeCap`, `cornerRadius`;
        `image`: `asset`, `fit` (`cover`, `contain`, or `fill` for a render
        of the layer), `cornerRadius`, `flipX`, `flipY`.
      required: [type, id, name, x, y, width, height]
      properties:
        type: { type: string, enum: [text, rectangle, ellipse, line, triangle, image] }
        id: { type: string }
        name: { type: string }
        param:
          type: string
          description: API parameter key (from a `{{key}}` or `#key` layer name).
        x: { type: number }
        y: { type: number }
        width: { type: number, minimum: 0 }
        height: { type: number, minimum: 0 }
        rotation: { type: number, description: 'Degrees, clockwise.' }
        opacity: { type: number, minimum: 0, maximum: 1 }
        clip:
          type: object
          description: The visible area left by a clipping parent frame (images and rectangles are cropped to it).
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
            radius: { type: number }
      additionalProperties: true

    FigmaImportWarning:
      type: object
      required: [message]
      properties:
        frame: { type: string }
        layer: { type: string }
        message: { type: string }

    FigmaImportResult:
      type: object
      required: [designs, fonts, assets, warnings]
      properties:
        designs:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Design'
              - type: object
                required: [pages, parameters, editorUrl]
                properties:
                  pages: { type: integer, minimum: 1 }
                  parameters:
                    type: array
                    items: { $ref: '#/components/schemas/TemplateParameter' }
                  editorUrl:
                    type: string
                    format: uri
                    description: The template in the editor.
        fonts:
          type: array
          items:
            type: object
            required: [family, status, usedFamily]
            properties:
              family: { type: string, description: The family as Figma names it. }
              status:
                type: string
                enum: [google, brand-library, imported, fallback]
                description: |
                  `google`: a built-in Google Font. `brand-library`: a font
                  file in the brand library. `imported`: added to the brand
                  library from Google Fonts now. `fallback`: unavailable,
                  drawn in `usedFamily`.
              usedFamily: { type: string }
              note: { type: string }
        assets:
          type: object
          required: [stored, bytes]
          description: Files added to the brand library (fonts not counted).
          properties:
            stored: { type: integer }
            bytes: { type: integer }
        warnings:
          type: array
          description: What didn't carry over exactly (flattened text styles, dropped effects, fonts that fell back, …).
          items: { $ref: '#/components/schemas/FigmaImportWarning' }

    ModificationValue:
      description: |
        A value for one modification key. Strings are used as-is (up to
        20,000 characters; `subtitles` up to 500,000, a whole SRT or WebVTT
        file); numbers and booleans are accepted for numeric and boolean
        style properties; `null` clears the value. `subtitles` also takes
        an array of cues.
      oneOf:
        - type: string
          maxLength: 500000
        - type: number
        - type: boolean
        - type: 'null'
        - type: array
          maxItems: 5000
          description: '`subtitles` only: the cues, in seconds on the video''s timeline.'
          items: { $ref: '#/components/schemas/SubtitleCue' }

    BackgroundRemoval:
      type: object
      required: [url, method, model, scaled, creditsCharged, asset]
      properties:
        url: { type: string, format: uri, description: The transparent PNG (the brand-library asset's URL). }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        method:
          type: string
          enum: [local, model]
          description: '`local`: U²-Net on our servers, original pixels kept. `model`: an image model redrew the subject (servers without the local model).'
        model: { type: string, description: 'The model that cut it out: `u2net`, `u2netp`, `silueta`, or an AI model slug.' }
        scaled: { type: boolean, description: 'The cut-out is smaller than the picture (over 4096 px a side, or over 10 MB as PNG).' }
        creditsCharged: { type: integer }
        asset: { $ref: '#/components/schemas/BrandAsset' }
    BrandAsset:
      type: object
      description: A file in the workspace's brand library.
      required: [id, kind, name, url, tags]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video, audio, font, color] }
        name: { type: string }
        url: { type: string }
        mimeType: { type: [string, 'null'] }
        size: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
        tags: { type: array, items: { type: string } }
        meta: { type: [object, 'null'], additionalProperties: true, description: 'Facts read from the file: `width`, `height` (images, videos), `duration` (videos, audio).' }
    TranscribeRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: 'An audio file (MP3, M4A, WAV, Ogg) or a video (MP4, WebM) with sound, up to 100 MB.' }
        language: { type: string, description: 'ISO-639-1 code such as `en`; detected when omitted.' }
        style: { type: string, enum: [standard, short], default: standard, description: '`standard`: up to 2 lines of 42 characters. `short`: one line of up to 24 characters.' }
        maxCharsPerLine: { type: integer, minimum: 12, maximum: 80 }
        maxLines: { type: integer, minimum: 1, maximum: 3 }
        start: { type: number, minimum: 0, description: Seconds into the file to start from. }
        duration: { type: number, minimum: 0.5, description: 'Seconds to transcribe (default: to the end).' }
        offset: { type: number, minimum: 0, default: 0, description: Seconds added to every cue (where `start` lands on your video). }
        words: { type: boolean, default: false, description: Include the word timestamps. }
    Transcription:
      type: object
      required: [duration, text, cues, srt, vtt, creditsCharged]
      properties:
        language: { type: [string, 'null'] }
        duration: { type: number, description: Seconds of audio transcribed. }
        text: { type: string }
        cues: { type: array, items: { $ref: '#/components/schemas/SubtitleCue' } }
        srt: { type: string }
        vtt: { type: string }
        words:
          type: array
          items:
            type: object
            properties:
              word: { type: string }
              start: { type: number }
              end: { type: number }
        creditsCharged: { type: integer }
        model: { type: string }
        mock: { type: boolean, description: 'A development server without an AI key: placeholder words.' }

    SubtitleCue:
      type: object
      required: [start, end, text]
      properties:
        start:
          type: number
          minimum: 0
          description: Seconds on the video's timeline when the cue appears.
        end:
          type: number
          description: Seconds when it goes (after `start`).
        text:
          type: string
          maxLength: 1000
          description: Plain text; a newline starts a new line. Styling tags are stripped.

    RenderRequest:
      type: object
      required: [templateId]
      properties:
        templateId:
          type: string
          maxLength: 64
          description: |
            Id of a design in the API key's workspace or of a template-library
            template. A library template can also be named by its slug
            (`tool-quote-card-paper`).
        modifications:
          type: object
          description: |
            Values to fill in, keyed by modification key: `key`,
            `pageN@key`, `key.property` or `pageN@key.property` (see
            "Modification keys" in the introduction). Keys are at most 200
            characters.
          propertyNames:
            minLength: 1
            maxLength: 200
          additionalProperties: { $ref: '#/components/schemas/ModificationValue' }
        response: { $ref: '#/components/schemas/RenderOptions' }
        async:
          type: boolean
          default: false
          description: |
            Run as a render job and answer `202` with its `jobId` at once
            (see `GET /render-jobs/{id}`). MP4 renders are always jobs; this
            makes the request return without waiting.
        webhookUrl:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Render jobs only (`"async": true` or an MP4): JamFrame POSTs
            `{ "event": "render.completed" | "render.failed", "job": … }`
            here when the job ends (see the `renderJobCallback` webhook).
            Must be `https://` in production and must not point to a
            private or loopback address. Sending it with a synchronous
            image or PDF render is a `400`.
        expiresIn:
          type: integer
          minimum: 1
          maximum: 604800
          default: 300
          description: |
            How long the file links in the answer work, in seconds: 5
            minutes by default, at most 7 days (`expiresAt` says until
            when). A render job keeps it: each `GET /render-jobs/{id}`, and
            each webhook, carries fresh links that work this long. Files are
            deleted 8 days after the render. For a permanent image link, use
            a Dynamic URL. Not with `response.type: "base64"`.
          example: 3600
        translate:
          type: boolean
          default: false
          description: |
            Translate every text layer's final text (after `modifications`
            and AI layers) into `lang` with AI, in one call per render.
            `{{placeholders}}`, links, e-mail addresses, @handles, #hashtags
            and numbers are kept as they are. Cached per text and language:
            a repeat costs no AI credits. Needs `lang`.
        lang:
          type: string
          minLength: 2
          maxLength: 35
          description: The language to translate into with `translate`, a BCP 47 tag such as `es`, `fr`, `pt-BR` or `zh-Hant`.
          example: es
        ai:
          type: object
          additionalProperties: false
          description: How the render's AI layers and translation behave.
          properties:
            onError:
              type: string
              enum: [fail, fallback]
              default: fail
              description: |
                `fail`: an AI failure fails the render with its `AI_*` code.
                `fallback`: AI layers render their saved text and image (a
                cached result is still used) and the text stays
                untranslated, with a warning; no AI credits are charged.

    RenderOptions:
      type: object
      description: How to render and how to return the result. Every field is optional.
      properties:
        type:
          type: string
          enum: [url, base64]
          default: url
          description: |
            `url` stores each file and returns a link to it that works for
            `expiresIn` seconds. `base64` returns the file bytes inline and
            stores nothing.
        format:
          type: string
          enum: [png, jpeg, jpg, webp, pdf, mp4]
          default: png
          description: |
            Output format. `jpg` is an alias of `jpeg`. `mp4` renders a
            video (H.264, 30 fps, AAC audio when the template has a track,
            subtitles burned in) as a render job.
        scale:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
          description: Pixel density for images (2 = twice the canvas size). Ignored for PDF and MP4 (videos are the canvas size).
        quality:
          type: integer
          minimum: 1
          maximum: 100
          description: Compression quality for `jpeg` and `webp`. Ignored for `png`, `pdf` and `mp4`.
        includePages:
          type: array
          maxItems: 50
          items: { type: integer, minimum: 1 }
          description: |
            Pages to render (from 1). All pages when omitted. A page the
            template doesn't have is a `400 VALIDATION_ERROR`; at most 20
            pages are rendered per request.
        size:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Smart Resize: render every page at this size. A size saved on
            the template (its id from `GET /designs/{id}` `sizes`, with its
            manual adjustments), a size name (`story`, `reel`, `square`,
            `portrait`, `landscape`, `widescreen`, `thumbnail`, `pin`, or a
            preset id like `instagram-story`, `og-image`,
            `youtube-thumbnail`), `"WIDTHxHEIGHT"` (16–10000 px; a saved
            size of those dimensions is used when there is one), or
            `original`. Works with every format, MP4 included.
          examples: [story, 1080x1920, original]
        sizes:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 64 }
          description: |
            Smart Resize: render each of these sizes (same values as
            `size`) in one synchronous call; `content` is then one entry per
            size (`SizedContent`). Not with `size`, `mp4`, `async` or
            `base64`. Credits: 1 per page per size. Two values that name the
            same output (`story` and `1080x1920`) are a `400`, and so is a
            call that would render more than 30 pages in all (pages ×
            sizes): ask for fewer, or send one request per size.
          examples: [[original, story, square]]
        subtitles:
          type: string
          enum: [srt, vtt]
          description: |
            MP4 only: also store the video's subtitles as an `.srt` or
            `.vtt` file next to the MP4 and return its URL as
            `data.subtitles`. Free. Without subtitles the file has no cues
            (and a warning says so).
        cmyk:
          description: |
            **Experimental.** PDF only (`"format": "pdf"`); off by default.
            Converts the PDF's colours to CMYK for print with an ICC
            profile: text and shapes stay vector, greys and black text print
            with black ink only, and the file gets the profile as its output
            intent and is labelled PDF/X-4 when it qualifies. `true` uses
            `fogra39`. Semi-transparent areas blend in CMYK, as PDF/X-4
            requires, so overlaps can look slightly different from the
            screen. The options and the output may still change.
          oneOf:
            - type: boolean
            - type: object
              additionalProperties: false
              properties:
                profile:
                  type: string
                  enum: [fogra39, fogra51, fogra52, fogra47, fogra29, fogra40, fogra45, ifra26, gracol2013, gracol2013-uncoated, swop2013, japan2011, gracol2006]
                  default: fogra39
                  description: |
                    The printing condition. `fogra39` (offset, coated paper,
                    Europe), `fogra51` / `fogra52` (PSO Coated / Uncoated v3,
                    Europe), `fogra47` and `fogra29` (uncoated, Europe),
                    `fogra40` and `fogra45` (magazine paper), `ifra26`
                    (newspapers), `gracol2013`, `gracol2013-uncoated` and
                    `gracol2006` (sheet-fed, USA), `swop2013` (publication,
                    USA), `japan2011` (Japan Color 2011 Coated). Ask your
                    print shop which one to use.
          examples: [true, { profile: gracol2013 }]
        compress:
          description: |
            **Experimental.** PDF only (`"format": "pdf"`); off by default.
            Makes the PDF smaller, like Ghostscript's PDF settings: images
            drawn at more than the preset's resolution are downsampled
            (measured where each image is drawn), photos may be stored as
            JPEG, and the file structure is compressed. Text and shapes are
            not changed. `true` uses the `ebook` preset. With `cmyk`, the CMYK
            file is compressed. The options and the output may still change.
          oneOf:
            - type: boolean
            - type: object
              additionalProperties: false
              properties:
                preset:
                  type: string
                  enum: [ebook, screen, printer, prepress]
                  default: ebook
                  description: |
                    `screen`: 72 dpi, JPEG quality 60 (smallest). `ebook`:
                    150 dpi, quality 75 (sharing and email). `printer`: 300
                    dpi, quality 90. `prepress`: 300 dpi, quality 95 (print
                    shops).
                dpi:
                  type: integer
                  minimum: 36
                  maximum: 1200
                  description: |
                    Image resolution in pixels per inch, instead of the
                    preset's. An image is downsampled only when it is above
                    1.5 times this.
          examples: [true, { preset: printer }, { preset: ebook, dpi: 200 }]

    SizedContent:
      type: object
      description: One size of a `response.sizes` render.
      required: [size, name, width, height, pages]
      properties:
        size:
          type: string
          description: The size as requested.
        name:
          type: string
          description: The saved size's or size preset's name (`Original` for `original`).
        width: { type: integer }
        height: { type: integer }
        pages:
          type: array
          items: { type: integer, minimum: 1 }
          description: Template pages rendered at this size.
        url:
          type: string
          description: A link to the file, when this size is one file (one image, or any PDF). Works until `data.expiresAt`.
        urls:
          type: array
          items: { type: string }
          description: One file per page (a carousel), in page order. Links that work until `data.expiresAt`.

    RenderResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RenderResult' }
        warnings:
          type: array
          items: { type: string }
          description: |
            Non-fatal problems, such as modification keys that matched no
            layer or placeholder. Omitted when there are none.

    RenderResult:
      description: The `data` of a successful render, and a succeeded render job's `result`.
      type: object
      required: [content, type, format, pages, credits, renderId, responseTime]
      properties:
        content:
          description: |
            One link or base64 string per file. A single string when
            the render produced one file (one image, any PDF, any MP4);
            an array in page order for multi-page images. With
            `response.sizes`, one `SizedContent` per size instead. Links
            are signed: they work until `expiresAt`, then answer `403`.
          oneOf:
            - type: string
            - type: array
              items: { type: string }
            - type: array
              items: { $ref: '#/components/schemas/SizedContent' }
        urls:
          type: array
          items: { type: string }
          description: |
            `response.type: "url"` only: every file's link in one list, in
            page order; with `response.sizes`, every size's files in the
            order of `content`. The same links as `content`, but always an
            array, for clients that can't tell a string from an array
            (Make's formulas, for example).
        expiresAt:
          type: string
          format: date-time
          description: |
            `response.type: "url"` only: when the links in `content` (and
            `subtitles`) stop working, `expiresIn` seconds after they were
            handed out. A render job's `result` gets fresh links, and a new
            `expiresAt`, on every read.
        type:
          type: string
          enum: [url, base64]
        format:
          type: string
          enum: [png, jpeg, webp, pdf, mp4]
          description: The output format (`jpg` requests report `jpeg`).
        pages:
          type: array
          items: { type: integer, minimum: 1 }
          description: The template pages that were rendered (for MP4, the scenes in order).
        credits:
          type: integer
          description: Credits charged (1 per image or PDF page; 1 per second of video output, rounded up; with `sizes`, 1 per page per size).
        renderId:
          type: string
          description: Id of this render, for support and usage logs.
        responseTime:
          type: integer
          description: Server-side render time in milliseconds.
        duration:
          type: number
          description: MP4 only. The video's length in seconds (its frames / 30; each scene transition overlaps two scenes and shortens it).
        subtitles:
          type: string
          description: MP4 with `response.subtitles` only. A link to the `.srt` / `.vtt` file, until `expiresAt`.
        aiCredits:
          type: integer
          minimum: 0
          description: |
            Templates with AI layers, or `translate`: AI credits charged for
            this render (once for every size, page and frame), 0 when every
            result came from the cache. Omitted for renders without AI.

    RenderItem:
      type: object
      description: One render from the workspace's render log.
      required:
        [id, createdAt, designId, designName, source, format, pages, credits, status, durationMs, outputs, error, cached]
      properties:
        id:
          type: string
          description: The render id (`renderId` in the render response).
        createdAt: { type: string, format: date-time }
        designId:
          type: [string, 'null']
          description: The template rendered. `null` when it has since been deleted.
        designName:
          type: [string, 'null']
          description: The template's current name. `null` when it has been deleted.
        source:
          type: string
          enum: [api, editor, signed-url, dynamic-url, form, workflow, shopify, webflow]
          description: |
            `api` for this API (including integrations such as Zapier and
            Make), `editor` for the web app's test render, `signed-url` and
            `dynamic-url` for the public render URLs, `form` for a template's
            public form, `workflow` for a workflow's runs, `shopify` for the
            Shopify app, `webflow` for the Webflow app.
        cached:
          type: boolean
          description: |
            Served from the render cache (signed and dynamic URLs): nothing
            was rendered, `credits` is 0, and `outputs` are the cached
            render's files.
        format:
          type: string
          enum: [png, jpeg, webp, pdf, mp4]
        pages:
          type: integer
          minimum: 0
          description: Number of template pages rendered (0 when a render job failed before rendering).
        credits:
          type: integer
          minimum: 0
          description: Credits charged. Always 0 for a failed render.
        status:
          type: string
          enum: [succeeded, failed]
        durationMs:
          type: integer
          description: Server-side render time in milliseconds.
        outputs:
          type: array
          description: |
            The stored files, in page order: one per page for images, one
            for a PDF or an MP4. Empty for failed renders and for `base64`
            renders, which store nothing. Each read answers fresh links;
            files are deleted 8 days after the render (31 for signed and
            dynamic URLs).
          items: { $ref: '#/components/schemas/RenderOutputFile' }
        error:
          type: [string, 'null']
          maxLength: 300
          description: Why a failed render failed (shortened to 300 characters). `null` otherwise.

    SignedUrlRequest:
      type: object
      required: [templateId]
      additionalProperties: false
      properties:
        templateId:
          type: string
          maxLength: 64
          description: A template of the workspace, or a template-library template.
        modifications:
          type: object
          maxProperties: 50
          description: As in `POST /render`. Values up to 2000 characters.
          additionalProperties:
            type: [string, number, boolean, 'null']
        response:
          type: object
          additionalProperties: false
          properties:
            format:
              type: string
              enum: [png, jpeg, jpg, webp, pdf]
              default: png
            scale:
              type: integer
              minimum: 1
              maximum: 3
              default: 1
              description: Pixel density for images.
            quality:
              type: integer
              minimum: 1
              maximum: 100
              description: JPEG and WebP quality.
            includePages:
              type: array
              items: { type: integer, minimum: 1 }
              minItems: 1
              maxItems: 20
              description: One page for an image (default 1); any pages for a PDF (default all).
            size:
              type: string
              maxLength: 64
              description: A Smart Resize target (a size id, a size name or `WIDTHxHEIGHT`), as `response.size` in `POST /render`.
        expiresIn:
          type: integer
          minimum: 1
          maximum: 31536000
          default: 604800
          description: Seconds until the URL stops working (default 7 days, at most 1 year).
        cacheSeconds:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 2592000
          description: |
            How long a render of this URL is reused (default and most 30
            days, since its file is deleted after 31; 0 renders every
            request). URLs signed with a longer time before reuse it for 30
            days.

    SignedUrlResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url, templateId, format, expiresAt]
          properties:
            url:
              type: string
              format: uri
              description: The public URL, `<origin>/r/s/<kid>.<payload>.<sig>.<ext>`.
            templateId: { type: string }
            format:
              type: string
              enum: [png, jpeg, webp, pdf]
            expiresAt: { type: string, format: date-time }
        warnings:
          type: array
          items: { type: string }
          description: Modification keys that match nothing in the template.

    PublicUrlError:
      type: object
      required: [error, message]
      description: The error body of a public render URL. Short and generic on purpose.
      properties:
        error:
          type: string
          enum:
            - INVALID_PARAMETERS
            - INVALID_SIGNATURE
            - NOT_FOUND
            - URL_EXPIRED
            - URL_DISABLED
            - CREDIT_CAP_REACHED
            - CREDITS_EXHAUSTED
            - UNAVAILABLE
            - MEDIA_UNAVAILABLE
            - RATE_LIMITED
            - BUSY
            - RENDER_FAILED
        message: { type: string }

    PublicFormError:
      type: object
      required: [error, message]
      description: The error body of the public form API. Short and generic on purpose.
      properties:
        error:
          type: string
          enum:
            - NOT_FOUND
            - FORM_DISABLED
            - FORM_EXPIRED
            - INVALID_VALUES
            - INVALID_REQUEST
            - CAPTCHA_FAILED
            - CAPTCHA_UNAVAILABLE
            - UPLOAD_INVALID
            - UPLOAD_TOO_LARGE
            - UPLOADS_UNAVAILABLE
            - CREDIT_CAP_REACHED
            - CREDITS_EXHAUSTED
            - UNAVAILABLE
            - MEDIA_UNAVAILABLE
            - RATE_LIMITED
            - BUSY
            - RENDER_FAILED
            - FILE_EXPIRED
            - BODY_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: '`INVALID_VALUES` only: the problem with each field, by key.'

    PublicFormField:
      type: object
      required: [key, kind, input, label, help, required, options, maxLength, placeholder]
      properties:
        key:
          type: string
          description: The answer's key in `values` (a parameter, or `parameter.prop` for a style field).
        kind: { type: string, enum: [text, image, color, url, choice] }
        input: { type: string, enum: [text, textarea, select, upload, url, upload-or-url, color] }
        label: { type: string }
        help: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
          description: The choices of a `select`.
        maxLength: { type: integer }
        placeholder:
          type: string
          description: The template's own text (text fields), shown as the input's placeholder.

    PublicForm:
      type: object
      required: [form, template, appName, turnstileSiteKey]
      properties:
        form:
          type: object
          required: [id, title, description, status, fields, output, branding, uploads]
          properties:
            id: { type: string, description: The public id. }
            title: { type: string }
            description: { type: [string, 'null'] }
            status:
              type: string
              enum: [active, cap_reached, unavailable]
              description: '`unavailable`: the server can''t take renders or uploads (no bot check configured).'
            fields:
              type: array
              items: { $ref: '#/components/schemas/PublicFormField' }
            output:
              type: object
              required: [format, scale, pages, width, height]
              properties:
                format: { type: string, enum: [png, jpeg, webp, pdf] }
                scale: { type: integer, enum: [1, 2] }
                pages: { type: array, items: { type: integer } }
                width: { type: integer }
                height: { type: integer }
            branding:
              type: object
              required: [logoUrl, accentColor]
              properties:
                logoUrl: { type: [string, 'null'] }
                accentColor: { type: [string, 'null'], description: '#rrggbb' }
            uploads:
              type: object
              required: [maxBytes, accept]
              properties:
                maxBytes: { type: integer }
                accept: { type: array, items: { type: string } }
        template:
          type: object
          required: [pages, variables, customFonts]
          description: What the live preview draws (the editor's template JSON, one page each).
          properties:
            pages:
              type: array
              items:
                type: object
                required: [canvas, elements]
                properties:
                  canvas: { type: object, additionalProperties: true }
                  elements: { type: array, items: { type: object, additionalProperties: true } }
            variables:
              type: object
              additionalProperties: { type: string }
            customFonts:
              type: array
              items: { type: object, additionalProperties: true }
        appName: { type: string }
        turnstileSiteKey:
          type: string
          description: Cloudflare Turnstile site key; empty when the check is off.

    PublicFormRenderRequest:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: { type: string }
          description: Answers by field key.
        turnstileToken:
          type: string
          description: Required when the form's `turnstileSiteKey` is not empty.

    PublicFormRender:
      type: object
      required: [format, files]
      description: The render's files. Nothing says whether it came from the render cache or which render it was.
      properties:
        format: { type: string, enum: [png, jpeg, webp, pdf] }
        files:
          type: array
          items:
            type: object
            required: [url, page, downloadUrl]
            properties:
              url:
                type: string
                format: uri-reference
                description: The file, shown inline (`GET /api/public/forms/{publicId}/files/{handle}`), on the app's origin. A fresh handle per response.
              page: { type: [integer, 'null'] }
              downloadUrl:
                type: string
                format: uri-reference
                description: The same file as an attachment (`url` with `?download=1`).

    PublicFormUpload:
      type: object
      required: [id, url, expiresAt]
      properties:
        id: { type: string }
        url: { type: string, format: uri, description: The answer to send for the field. }
        expiresAt: { type: string, format: date-time }

    RenderOutputFile:
      type: object
      required: [url, page]
      properties:
        url:
          type: string
          format: uri
          description: A link to the file, signed for this read. It works until `expiresAt`.
        page:
          type: [integer, 'null']
          minimum: 1
          description: The template page this file shows; for a PDF, its first page.
        expiresAt:
          type: string
          format: date-time
          description: When `url` stops working (5 minutes after the read).

    RenderTotals:
      type: object
      description: Credit usage in the organization's current billing period.
      required:
        [periodStart, periodEnd, creditsUsed, creditsQuota, creditsRemaining, workspaceCreditsUsed]
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        creditsUsed:
          type: integer
          description: Credits the organization used this period, across all its workspaces.
        creditsQuota:
          type: [integer, 'null']
          description: Credits the organization's plan includes per period. `null` when unlimited.
        creditsRemaining:
          type: [integer, 'null']
          description: Credits left this period. `null` when unlimited.
        workspaceCreditsUsed:
          type: integer
          description: This workspace's share of `creditsUsed`.

    WebhookEventType:
      type: string
      enum:
        - design.created
        - design.updated
        - design.deleted
        - render.completed
        - render.failed
        - social.post.published
        - social.post.failed
        - workflow.run.completed
        - workflow.run.failed
      description: |
        An event a subscription can listen to. Sent as the
        `X-Webhook-Event` header on every delivery.

    WebhookSubscription:
      type: object
      required:
        - id
        - url
        - events
        - status
        - secretTail
        - failureCount
        - lastFiredAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        url:
          type: string
          format: uri
          description: |
            The URL that receives signed POSTs. Always `https` in
            production.
        events:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WebhookEventType' }
        status:
          type: string
          enum: [active, suspended, revoked]
          description: |
            `suspended` once 20 consecutive deliveries have failed.
            Re-activate it in the web app after fixing your endpoint.
            `revoked` once its creator lost editor access to the
            workspace: it never delivers again (create a new one).
        secretTail:
          type: string
          description: |
            Last 4 characters of the signing secret, for display
            ("wh_sec_…wxyz"). The full secret is only returned by
            `createWebhookSubscription` and
            `rotateWebhookSubscriptionSecret`.
        failureCount:
          type: integer
          description: Consecutive failed deliveries since the last success.
        lastFiredAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WebhookSubscriptionInput:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: |
            Endpoint that receives webhook POSTs. Must be `https://` in
            production and must not resolve to a private or loopback
            address.
        events:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WebhookEventType' }

    WebhookEvent:
      type: object
      required: [id, type, createdAt, data]
      description: |
        Body of every webhook POST. `id` identifies the event and is the
        same for every subscription that receives it; the
        `X-Webhook-Delivery` header identifies this subscription's
        delivery.
      properties:
        id:
          type: string
          description: Event id.
          example: whe_abcd1234EFGH56789ijklMNOP
        type: { $ref: '#/components/schemas/WebhookEventType' }
        createdAt: { type: string, format: date-time }
        data:
          description: A `Design` for `design.*` events; a `RenderJob` for `render.*` events; a `SocialPostEvent` for `social.post.*` events; a `WorkflowRunEvent` for `workflow.run.*` events.
          oneOf:
            - $ref: '#/components/schemas/Design'
            - $ref: '#/components/schemas/RenderJob'
            - $ref: '#/components/schemas/SocialPostEvent'
            - $ref: '#/components/schemas/WorkflowRunEvent'

    RenderJobAccepted:
      type: object
      required: [data]
      description: The `202` answer of a render that runs as a render job.
      properties:
        data:
          type: object
          required: [jobId, status]
          properties:
            jobId:
              type: string
              description: Pass it to `GET /render-jobs/{id}`.
            status:
              type: string
              enum: [queued, running]

    RenderJob:
      type: object
      description: |
        A render job: an MP4 render, or a render sent with
        `"async": true`. Also the `data` of `render.*` webhook events and
        the `job` of `webhookUrl` callbacks.
      required: [id, status, progress, format, templateId, createdAt, startedAt, finishedAt, result, error]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
          description: '`succeeded` and `failed` are final.'
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: |
            0 to 1 while running. For a video, the share of its frames
            captured so far (a long video is rendered in chunks side by
            side; this counts all of them); images and PDFs go from 0 to 1
            when done. A job interrupted by a server restart starts again
            once (from 0) and is charged only when it succeeds.
        format:
          type: string
          enum: [png, jpeg, webp, pdf, mp4]
        templateId:
          type: [string, 'null']
          description: The template rendered. `null` when it has since been deleted.
        createdAt: { type: string, format: date-time }
        startedAt:
          type: [string, 'null']
          format: date-time
          description: When a worker first picked the job up.
        finishedAt:
          type: [string, 'null']
          format: date-time
        result:
          description: |
            When `succeeded`: the same object a synchronous render returns
            as `data` (for an MP4, `content` is the video's link and
            `duration` its length in seconds). Its links are signed each
            time the job is read or sent, for the request's `expiresIn`,
            until `expiresAt`. `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/RenderResult'
            - type: 'null'
        error:
          description: |
            When `failed`: the error a synchronous render would have
            answered (`VALIDATION_ERROR` for an image, video or audio URL
            that won't load; `INTERNAL` when the renderer failed). No
            credits are charged. `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        warnings:
          type: array
          items: { type: string }
          description: As in a synchronous render (e.g. unknown modification keys). Omitted when there are none.

    RenderJobCallback:
      type: object
      required: [event, job]
      description: Body of the POST to a render request's `webhookUrl`.
      properties:
        event:
          type: string
          enum: [render.completed, render.failed]
        job: { $ref: '#/components/schemas/RenderJob' }
    DesignGenerateCallback:
      type: object
      required: [event, job]
      description: Body of the POST to a `POST /designs/generate` request's `webhookUrl`.
      properties:
        event:
          type: string
          enum: [design.generate.completed, design.generate.failed]
        job: { $ref: '#/components/schemas/DesignGenerateJob' }

    SocialPlatform:
      type: string
      enum: [instagram, facebook, linkedin, linkedin_page, x, tiktok, youtube, pinterest, bluesky, buffer]
      description: |
        `linkedin` is a personal profile, `linkedin_page` a company page,
        `facebook` a Page. `pinterest` posts Pins to a board. `buffer` is a channel of a connected Buffer
        account (docs/buffer.md); the post goes into its Buffer queue.

    SocialAccount:
      type: object
      required: [id, platform, platformName, name, status, sandbox, createdAt]
      properties:
        id: { type: string }
        platform: { $ref: '#/components/schemas/SocialPlatform' }
        platformName: { type: string, example: LinkedIn }
        name: { type: string }
        username: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        status:
          type: string
          enum: [active, needs_reconnect]
          description: '`needs_reconnect`: the token was revoked or expired; reconnect it in the app.'
        statusReason: { type: [string, 'null'] }
        sandbox:
          type: boolean
          description: Connected without platform keys on a development server; posting is simulated.
        reconnectBy:
          type: [string, 'null']
          format: date-time
          description: When the connection lapses unless reconnected (LinkedIn tokens last 60 days).
        createdAt: { type: string, format: date-time }
        lastPostedAt: { type: [string, 'null'], format: date-time }

    SocialPostInput:
      type: object
      additionalProperties: false
      description: |
        One media source (`templateId`, `renderId` or `mediaUrls`; drafts
        may have none), the accounts, the caption, and when. Unknown fields
        are refused.
      properties:
        templateId: { type: string, maxLength: 64, description: Render this template and post the result. }
        modifications:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ModificationValue' }
          description: The template's parameters, as for `POST /render`.
        response:
          type: object
          additionalProperties: false
          description: |
            Render options. Default format: `jpeg` when an Instagram or
            TikTok account is in the post, `mp4` when every account is
            YouTube, else `png`.
          properties:
            format: { type: string, enum: [png, jpeg, jpg, webp, pdf, mp4] }
            scale: { type: integer, minimum: 1, maximum: 3 }
            quality: { type: integer, minimum: 1, maximum: 100 }
            includePages: { type: array, items: { type: integer, minimum: 1 }, maxItems: 50 }
        renderId: { type: string, maxLength: 64, description: Post the stored files of this render. }
        mediaUrls:
          type: array
          minItems: 1
          maxItems: 35
          items: { type: string, maxLength: 2048 }
          description: Image, video or PDF URLs (up to 100 MB each), downloaded and stored when the post is created.
        accounts:
          type: array
          maxItems: 25
          description: Account ids, or objects overriding the caption or options for one account.
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: false
                required: [id]
                properties:
                  id: { type: string }
                  caption: { type: string }
                  options: { type: object, description: "This account's platform options (see `options`)." }
        caption: { type: string, maxLength: 70000 }
        captions:
          type: object
          description: Per-platform captions over `caption` (a LinkedIn page falls back to `linkedin`).
          additionalProperties: false
          properties:
            instagram: { type: string }
            facebook: { type: string }
            linkedin: { type: string }
            linkedin_page: { type: string }
            x: { type: string }
            tiktok: { type: string }
            youtube: { type: string }
            pinterest: { type: string }
            bluesky: { type: string }
            buffer: { type: string }
        options:
          type: object
          additionalProperties: false
          description: Per-platform options.
          properties:
            instagram:
              type: object
              additionalProperties: false
              properties:
                shareToFeed: { type: boolean, description: 'Reels: also show in the feed (default true).' }
            facebook:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 255, description: Video title. }
            linkedin: { $ref: '#/components/schemas/LinkedInPostOptions' }
            linkedin_page: { $ref: '#/components/schemas/LinkedInPostOptions' }
            x: { type: object, additionalProperties: false }
            tiktok:
              type: object
              additionalProperties: false
              description: |
                TikTok requires an explicit `privacyLevel` (one the creator
                offers). Until TikTok audits the app only `SELF_ONLY` works.
                With `draft: true` the post goes to the creator's TikTok inbox
                instead, and they finish it in the TikTok app: no
                `privacyLevel` needed, and the interaction and disclosure
                options don't apply.
              properties:
                draft:
                  type: boolean
                  description: >-
                    Send to the creator's TikTok inbox as a draft instead of
                    posting. Video drafts carry no caption; photo drafts keep
                    `title` and the caption. At most 5 pending drafts per
                    account in 24 hours.
                privacyLevel: { type: string, enum: [PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR, SELF_ONLY] }
                allowComment: { type: boolean }
                allowDuet: { type: boolean }
                allowStitch: { type: boolean }
                commercialContent: { type: boolean, description: The content disclosure toggle. }
                yourBrand: { type: boolean, description: Promotes yourself or your business (Promotional content). }
                brandedContent: { type: boolean, description: Promotes a third party (Paid partnership); can't be SELF_ONLY. }
                aiGenerated: { type: boolean }
                title: { type: string, description: 'Photo posts: the title (90 characters).' }
                autoAddMusic: { type: boolean }
                videoCoverTimestampMs: { type: integer, minimum: 0 }
            youtube:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, description: "Default: the caption's first line (100 characters)." }
                privacy: { type: string, enum: [public, unlisted, private] }
                madeForKids: { type: boolean }
                tags: { type: array, items: { type: string } }
                categoryId: { type: string, description: 'YouTube category id (default 22).' }
                aiGenerated: { type: boolean, description: Altered or synthetic content. }
            pinterest:
              type: object
              additionalProperties: false
              description: |
                The caption is the Pin's description (800 characters). Set
                `boardId` per account (`accounts[].options`) to pick a board.
              properties:
                boardId: { type: string, description: "The board (default: the account's first board)." }
                title: { type: string, maxLength: 100, description: The Pin's title. }
                link: { type: string, format: uri, maxLength: 2048, description: Where the Pin links to. }
                altText: { type: string, maxLength: 500 }
            bluesky:
              type: object
              additionalProperties: false
              description: Captions are limited to 300 graphemes; up to 4 images (2 MB each) or 1 video.
              properties:
                altText: { type: string, maxLength: 2000, description: Alt text for the images or the video. }
            buffer:
              type: object
              additionalProperties: false
              description: Buffer channels (docs/buffer.md).
              properties:
                mode:
                  type: string
                  enum: [queue, next, now, draft]
                  description: 'queue (default): the next free slot; next: first in the queue; now: at once; draft: a Buffer draft.'
                instagramType: { type: string, enum: [post, story, reel] }
                facebookType: { type: string, enum: [post, story, reel] }
                pinterestBoardId: { type: string, maxLength: 100, description: "Default: the channel's first board." }
                title: { type: string, maxLength: 100, description: Pinterest Pin title. }
                link: { type: string, format: uri, maxLength: 2048, description: Pinterest Pin link. }
                youtubeCategoryId: { type: string, description: 'YouTube category id (default 22).' }
        scheduledAt:
          type: string
          description: |
            ISO 8601. With `Z` or an offset it is absolute; without one it is
            read in `timezone`. Up to a year ahead; omit to post now.
          example: '2026-11-10T09:00'
        timezone: { type: string, description: 'IANA time zone, e.g. Europe/Paris (default UTC).' }
        draft: { type: boolean, description: Save without posting. }

    LinkedInPostOptions:
      type: object
      additionalProperties: false
      properties:
        firstComment: { type: string, maxLength: 1250, description: Posted as a comment right after the post. }
        documentTitle: { type: string, maxLength: 400, description: 'PDF document posts: the title.' }
        visibility: { type: string, enum: [PUBLIC, CONNECTIONS], description: 'Profiles only (default PUBLIC).' }

    SocialMedia:
      type: object
      required: [kind, contentType, url]
      properties:
        kind: { type: string, enum: [image, video, pdf] }
        contentType: { type: string }
        url:
          type: string
          description: The file. A rendered file is a fresh link on every read that works for an hour (`expiresAt`); uploads and fetched media are plain URLs.
        expiresAt:
          type: string
          format: date-time
          description: Rendered files only. When `url` stops working.
        bytes: { type: integer }
        width: { type: integer }
        height: { type: integer }
        durationSec: { type: number }
        pages: { type: integer }

    SocialPostTarget:
      type: object
      required: [id, platform, accountName, status, caption, warnings, attempts]
      description: One account of a post.
      properties:
        id: { type: string }
        accountId: { type: [string, 'null'], description: '`null` once the account was removed.' }
        platform: { $ref: '#/components/schemas/SocialPlatform' }
        accountName: { type: string }
        status: { type: string, enum: [draft, queued, rendering, publishing, published, failed, canceled] }
        caption: { type: string, description: The caption this account posts. }
        permalink: { type: [string, 'null'] }
        externalId: { type: [string, 'null'], description: The platform's id of the post. }
        error:
          oneOf:
            - type: 'null'
            - type: object
              required: [kind, code, message]
              properties:
                kind: { type: string, enum: [auth, transient, permanent, validation] }
                code: { type: string }
                message: { type: string }
          description: Why it failed; while a retry is pending, the last error.
        warnings: { type: array, items: { type: string } }
        attempts: { type: integer, description: Transient failures so far. }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }

    SocialPost:
      type: object
      required: [id, status, caption, targets, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [draft, scheduled, queued, rendering, publishing, published, partial, failed, canceled] }
        caption: { type: string }
        captions: { type: object }
        options: { type: object }
        media:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/SocialMedia' }
          description: The files posted; `null` until a render-and-post has rendered.
        mediaSource: { type: object, description: 'Where the media comes from: `render`, `render_id` or `urls`.' }
        renderJobId: { type: [string, 'null'] }
        renderId: { type: [string, 'null'] }
        scheduledAt: { type: [string, 'null'], format: date-time }
        timezone: { type: [string, 'null'] }
        source: { type: string, enum: [app, api, mcp] }
        error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ApiError'
          description: When the media step (the render) failed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        targets:
          type: array
          items: { $ref: '#/components/schemas/SocialPostTarget' }

    SocialTargetIssues:
      type: object
      required: [accountId, platform, accountName, errors, warnings]
      properties:
        accountId: { type: string }
        platform: { $ref: '#/components/schemas/SocialPlatform' }
        accountName: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/SocialIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/SocialIssue' }

    SocialIssue:
      type: object
      required: [level, code, message]
      properties:
        level: { type: string, enum: [error, warning] }
        code: { type: string, example: caption_too_long }
        message: { type: string }

    SocialPostEvent:
      type: object
      required: [post, target]
      description: '`data` of `social.post.*` events: the post, and the account whose result this is.'
      properties:
        post: { $ref: '#/components/schemas/SocialPost' }
        target: { $ref: '#/components/schemas/SocialPostTarget' }

    WorkflowDefinition:
      type: object
      description: |
        The steps, as JSON with a version. Step objects may carry an `id`
        (1–32 letters, digits, `_` or `-`); one is assigned otherwise.
        `{{Column}}` placeholders in `action.mapping`, social captions and
        Slack messages are filled from each row (`{{render.url}}` too in
        deliveries). Secret fields (`source.token`, a Slack step's
        `webhookUrl`) are write-only: responses show `{ set: true, tail }`;
        send that back to keep the stored value, or `""` to clear it.
      required: [version, trigger, source, action]
      properties:
        version: { type: integer, enum: [1] }
        trigger:
          type: object
          required: [kind]
          description: |
            `manual`; `schedule` with `frequency` (`hourly` + `minute`;
            `daily`/`weekly`/`monthly` + `time` "HH:MM", `dayOfWeek` 0–6,
            `dayOfMonth` 1–28; `custom` + a 5-field `cron`, at most every
            15 minutes) and an IANA `timezone`; `webhook`; or `new_rows`
            with `intervalMinutes` (15, 30, 60, 180, 360, 720 or 1440).
          properties:
            kind: { type: string, enum: [manual, schedule, webhook, new_rows] }
            frequency: { type: string, enum: [hourly, daily, weekly, monthly, custom] }
            minute: { type: integer, minimum: 0, maximum: 59 }
            time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
            dayOfMonth: { type: integer, minimum: 1, maximum: 28 }
            cron: { type: string, maxLength: 120 }
            timezone: { type: string, maxLength: 64 }
            intervalMinutes: { type: integer, enum: [15, 30, 60, 180, 360, 720, 1440] }
        source:
          type: object
          required: [kind]
          description: |
            `google_sheets` (`url`, `sheet`?, `connectionId`? for a private
            sheet), `file_url` (`url` of a CSV or XLSX file, `format`
            auto/csv/xlsx, `sheet`?), `airtable` (`baseId`, `table`,
            `view`?, `token`), `drive_folder` (`folder`, `connectionId`) or
            `webhook` (the incoming webhook's payload).
          properties:
            kind: { type: string, enum: [google_sheets, file_url, airtable, drive_folder, webhook] }
            url: { type: string, maxLength: 2048 }
            sheet: { type: string, maxLength: 200 }
            format: { type: string, enum: [auto, csv, xlsx] }
            baseId: { type: string, maxLength: 40 }
            table: { type: string, maxLength: 200 }
            view: { type: string, maxLength: 200 }
            token:
              description: Write-only Airtable personal access token.
              oneOf:
                - { type: string, maxLength: 1000 }
                - $ref: '#/components/schemas/WorkflowSecret'
            folder: { type: string, maxLength: 2048 }
            connectionId: { type: string, maxLength: 64 }
        transforms:
          type: array
          maxItems: 10
          items:
            type: object
            required: [kind]
            description: |
              `filter` (`column`, `operator`: equals, not_equals, contains,
              not_contains, starts_with, is_empty, not_empty, greater_than,
              less_than; `value`), `sort` (`column`, `direction`),
              `limit` (`count`), `pick` (`which`: first/last/random,
              `count`), `dedupe` (`column`? else the whole row).
            properties:
              kind: { type: string, enum: [filter, sort, limit, pick, dedupe] }
              column: { type: string, maxLength: 200 }
              operator: { type: string }
              value: { type: string, maxLength: 500 }
              direction: { type: string, enum: [asc, desc] }
              count: { type: integer, minimum: 1, maximum: 10000 }
              which: { type: string, enum: [first, last, random] }
        action:
          type: object
          required: [kind, templateId]
          properties:
            kind: { type: string, enum: [render] }
            templateId: { type: string, maxLength: 64 }
            mapping:
              type: object
              description: Template parameter → value with `{{Column}}` placeholders.
              additionalProperties: { type: string, maxLength: 5000 }
            format: { type: string, enum: [png, jpeg, webp, pdf, mp4] }
            scale: { type: integer, minimum: 1, maximum: 3 }
            quality: { type: integer, minimum: 1, maximum: 100 }
            includePages:
              type: array
              items: { type: integer, minimum: 1 }
        deliver:
          type: array
          maxItems: 6
          items:
            type: object
            required: [kind]
            description: |
              `url`; `webhook` (`url`: each row POSTed as JSON, event
              `workflow.row.rendered`); `slack` (`webhookUrl`, `message`?);
              `social` (`accountIds`, `caption`?, `when`: now/schedule/draft,
              `scheduledAt`?, `timezone`?); `sheets_writeback` (`column`,
              `connectionId`); `drive_upload` (`folder`: a folder name this
              app creates in My Drive, or a link to one it created;
              `connectionId`); `s3_upload` (`provider`?: `aws` (default)
              or `r2`; `bucket`; `region` for S3; `accountId` and
              `jurisdiction`? for Cloudflare R2; `accessKeyId`,
              `secretAccessKey`; `key`?: the path and file name, with
              `{{Column}}`, `{{render.id}}`, `{{row.number}}` and
              `{{run.date}}` placeholders; default `renders/{{render.id}}`;
              the extension is added).
            properties:
              kind: { type: string, enum: [url, webhook, slack, social, sheets_writeback, drive_upload, s3_upload] }
              url: { type: string, maxLength: 2048 }
              webhookUrl:
                description: Write-only Slack incoming webhook URL.
                oneOf:
                  - { type: string, maxLength: 1000 }
                  - $ref: '#/components/schemas/WorkflowSecret'
              message: { type: string, maxLength: 3000 }
              provider: { type: string, enum: [aws, r2], description: 'Amazon S3 (default) or Cloudflare R2 (`s3_upload`).' }
              bucket: { type: string, maxLength: 63, description: 'Bucket name (`s3_upload`).' }
              accountId: { type: string, maxLength: 64, description: 'Cloudflare account ID, 32 characters (`s3_upload` with `provider: r2`).' }
              jurisdiction: { type: string, enum: [default, eu], description: 'R2 bucket jurisdiction (`s3_upload` with `provider: r2`).' }
              region: { type: string, maxLength: 32, description: 'The bucket''s AWS region, e.g. `us-east-1` (`s3_upload` with Amazon S3; ignored for R2).' }
              key: { type: string, maxLength: 1024, description: 'The object''s path and file name, without the extension (`s3_upload`).' }
              accessKeyId: { type: string, maxLength: 128, description: 'An IAM user''s access key ID allowed s3:PutObject on the bucket, or an R2 API token''s access key ID (`s3_upload`).' }
              secretAccessKey:
                description: Write-only secret access key of the S3 or R2 key (`s3_upload`).
                oneOf:
                  - { type: string, maxLength: 128 }
                  - $ref: '#/components/schemas/WorkflowSecret'
              accountIds:
                type: array
                maxItems: 25
                items: { type: string }
              caption: { type: string, maxLength: 10000 }
              when: { type: string, enum: [now, schedule, draft] }
              scheduledAt: { type: string, maxLength: 200 }
              timezone: { type: string, maxLength: 64 }
              column: { type: string, maxLength: 200 }
              folder: { type: string, maxLength: 2048 }
              connectionId: { type: string, maxLength: 64 }
    WorkflowSecret:
      type: object
      description: A stored secret, shown masked.
      required: [set]
      properties:
        set: { type: boolean, enum: [true] }
        tail: { type: string, description: The last 4 characters. }
    WorkflowCreate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        definition: { $ref: '#/components/schemas/WorkflowDefinition' }
        starter:
          type: string
          description: An Explore starter's id, e.g. `csv-quotes-webhook`.
    WorkflowUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        definition: { $ref: '#/components/schemas/WorkflowDefinition' }
        status: { type: string, enum: [draft, active] }
    WorkflowRunRequest:
      type: object
      properties:
        payload:
          description: Rows for a webhook-payload source (an array of objects, or one object).
        maxRows:
          type: integer
          minimum: 1
          maximum: 10000
          description: Render only the first N rows (a test run).
    Workflow:
      type: object
      required: [id, name, status, definition, steps, problems, trigger, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [draft, active] }
        definition: { $ref: '#/components/schemas/WorkflowDefinition' }
        steps: { type: integer, description: 'Steps as the plan counts them.' }
        problems:
          type: array
          description: What stops it from running (empty when ready).
          items:
            type: object
            required: [stepId, message]
            properties:
              stepId: { type: string }
              message: { type: string }
        trigger:
          type: object
          required: [kind, summary]
          properties:
            kind: { type: string }
            summary: { type: string, example: 'Every day at 09:00 (Europe/Paris)' }
        nextRunAt: { type: [string, 'null'], format: date-time }
        lastRunAt: { type: [string, 'null'], format: date-time }
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/WorkflowRun'
            - type: 'null'
        webhookUrl:
          type: [string, 'null']
          format: uri
          description: The incoming webhook URL (webhook trigger only). Anyone with it can start runs.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowRun:
      type: object
      required: [id, workflowId, trigger, status, rowsTotal, rowsSucceeded, rowsFailed, rowsSkipped, credits, warnings, createdAt]
      properties:
        id: { type: string }
        workflowId: { type: string }
        trigger: { type: string, enum: [manual, schedule, webhook, new_rows, api, mcp] }
        status: { type: string, enum: [queued, running, succeeded, partial, failed, canceled] }
        rowsTotal: { type: integer }
        rowsSucceeded: { type: integer }
        rowsFailed: { type: integer }
        rowsSkipped: { type: integer }
        credits: { type: integer, description: Render credits the run's renders cost. }
        error:
          type: [object, 'null']
          properties:
            code: { type: string, example: QUOTA_EXCEEDED }
            message: { type: string }
        warnings:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    WorkflowRunEvent:
      description: The `data` of `workflow.run.completed` and `workflow.run.failed` events.
      allOf:
        - $ref: '#/components/schemas/WorkflowRun'
        - type: object
          required: [workflowName]
          properties:
            workflowName: { type: string, description: The workflow's name when the run ended. }
    WorkflowRunRow:
      type: object
      required: [index, status, values, urls, credits, deliveries]
      properties:
        index: { type: integer }
        status: { type: string, enum: [pending, running, succeeded, partial, failed, skipped] }
        values:
          type: object
          additionalProperties: { type: string }
        rowNumber: { type: [integer, 'null'], description: Google Sheets row number. }
        modifications:
          type: [object, 'null']
          additionalProperties: { type: string }
        renderId: { type: [string, 'null'] }
        urls:
          type: array
          items: { type: string, format: uri }
          description: |
            The row's rendered files, as fresh links on every read that work
            for an hour. Files are deleted 8 days after the render.
        credits: { type: integer }
        deliveries:
          type: array
          items:
            type: object
            required: [stepId, kind, status]
            properties:
              stepId: { type: string }
              kind: { type: string }
              status: { type: string, enum: [succeeded, failed, sandbox] }
              message: { type: string }
              url: { type: string }
        error:
          type: [object, 'null']
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    AnalyticsBadQuery:
      description: A malformed date, a range in the wrong order or over 366 days, or an unknown platform.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { error: VALIDATION_ERROR, message: 'from must be on or before to' }
    Unauthorized:
      description: |
        Missing, malformed, expired or revoked API key, or the key's
        creator is suspended or no longer has editor access to the
        workspace.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            missing:
              value: { error: MISSING_API_KEY, message: Missing Authorization header }
            invalid:
              value: { error: INVALID_API_KEY, message: Invalid API key }
            expired:
              value: { error: EXPIRED_API_KEY, message: API key has expired }
    Forbidden:
      description: |
        The organization is on hold (`ORG_ON_HOLD`: reads still work,
        changes and renders are refused) or suspended (`ORG_SUSPENDED`:
        everything is refused).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            onHold:
              value:
                error: ORG_ON_HOLD
                message: This organization is on hold while we review recent activity. You can still view everything, but changes are paused.
            suspended:
              value:
                error: ORG_SUSPENDED
                message: This organization has been suspended.
    RenderedFile:
      description: The rendered file.
      headers:
        Cache-Control:
          description: '`public, max-age=<seconds>`: the cache time, at most one hour (dynamic URLs) or one day (signed URLs) and never past the URL''s expiry (`no-cache` when the cache time is 0).'
          schema: { type: string }
        ETag:
          description: Strong validator of the file's bytes; send it back in `If-None-Match` for a `304`.
          schema: { type: string }
        X-Render-Cache:
          description: '`HIT` (served from the render cache, free) or `MISS` (rendered now).'
          schema: { type: string, enum: [HIT, MISS] }
      content:
        image/png:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
        application/pdf:
          schema: { type: string, format: binary }
    PublicError:
      description: |
        A public render URL that can't be served, with `Cache-Control:
        no-store`:

        | Status | `error` | When |
        | --- | --- | --- |
        | 400 | `INVALID_PARAMETERS` | A query parameter or modification is invalid, an image URL isn't a public http(s) address, or the output would be over the pixel cap. |
        | 402 | `CREDIT_CAP_REACHED` | A dynamic URL's credit cap is used up (cached parameters are still served). |
        | 402 | `CREDITS_EXHAUSTED` | The workspace has no credits left. |
        | 403 | `INVALID_SIGNATURE` | A signed URL was changed, or its key was rotated. |
        | 403 | `UNAVAILABLE` | The account is on hold or suspended. |
        | 404 | `NOT_FOUND` | No such URL, or the template was deleted. |
        | 410 | `URL_EXPIRED` | The URL's expiry has passed. |
        | 410 | `URL_DISABLED` | The dynamic URL was turned off. |
        | 422 | `MEDIA_UNAVAILABLE` | An image could not be loaded (or its host resolves to a private address). |
        | 429 | `RATE_LIMITED` | Too many requests, or the URL's renders keep failing and it is paused for a while (see `Retry-After`). |
        | 500 | `RENDER_FAILED` | The render failed. |
        | 503 | `BUSY` | Too many renders in progress, for the server, the workspace or this URL (see `Retry-After`). |
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicUrlError' }
          examples:
            expired:
              value: { error: URL_EXPIRED, message: This link has expired. }
            cap:
              value: { error: CREDIT_CAP_REACHED, message: This link has used its credit allowance. }
            tampered:
              value: { error: INVALID_SIGNATURE, message: This link is not valid. }
    PublicFormFailure:
      description: |
        A public form request that can't be served, with `Cache-Control:
        no-store`:

        | Status | `error` | When |
        | --- | --- | --- |
        | 400 | `INVALID_VALUES` | An answer is missing or invalid (`fields` names each), or the output would be over the pixel cap. |
        | 400 | `INVALID_REQUEST` | The body isn't valid JSON (or couldn't be read). |
        | 400 | `CAPTCHA_FAILED` | The Turnstile token (or, on upload, the upload pass) is missing or was refused. |
        | 400 | `UPLOAD_INVALID` | Not a PNG, JPEG, WebP or GIF, too many pixels, or not an upload field. |
        | 402 | `CREDIT_CAP_REACHED` | The form's credit cap is used up (uploads: no room for one more render). |
        | 402 | `CREDITS_EXHAUSTED` | The owner's workspace has no credits left. |
        | 403 | `UNAVAILABLE` | The owner's account is on hold or suspended. |
        | 404 | `NOT_FOUND` | No such form, or its template was deleted, or not a file handle of this form. |
        | 410 | `FORM_DISABLED` | The owner turned the form off. |
        | 410 | `FORM_EXPIRED` | The form's expiry has passed. |
        | 410 | `FILE_EXPIRED` | The result file was deleted (7 days after the render). |
        | 413 | `UPLOAD_TOO_LARGE` | The upload is over 10 MB. |
        | 413 | `BODY_TOO_LARGE` | The JSON body is over 256 kB. |
        | 415 | `UNSUPPORTED_MEDIA_TYPE` | The body uses an unsupported charset or encoding. |
        | 422 | `MEDIA_UNAVAILABLE` | An image could not be loaded (or its host resolves to a private address). |
        | 429 | `RATE_LIMITED` | Too many requests, too many uploads to this form, or the form's renders keep failing and it is paused for a while (see `Retry-After`). |
        | 500 | `RENDER_FAILED` | The render failed. |
        | 503 | `BUSY` / `UPLOADS_UNAVAILABLE` / `CAPTCHA_UNAVAILABLE` | Too many renders in progress (see `Retry-After`), uploads are off, or the server has no bot check configured. |
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicFormError' }
          examples:
            invalid:
              value: { error: INVALID_VALUES, message: Some answers need attention., fields: { headline: Required. } }
            disabled:
              value: { error: FORM_DISABLED, message: This form has been turned off. }
            cap:
              value: { error: CREDIT_CAP_REACHED, message: This form has reached its limit. }
    NotFound:
      description: The requested resource was not found in this workspace.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            template:
              value: { error: NOT_FOUND, message: Template clx8m2k3p0002abcd1234efgh not found in this workspace }
    RateLimited:
      description: |
        Too many requests for this organization (or endpoint). Honour the `Retry-After`
        response header (seconds) or the `detail.retryAfter` field.
      headers:
        Retry-After:
          description: Seconds until the next request will succeed.
          schema: { type: integer }
        RateLimit:
          description: |
            The current window (IETF rate-limit headers, draft 7), sent on
            every authenticated response: `limit=100, remaining=0, reset=42`
            (requests per window, requests left, seconds until it resets).
          schema: { type: string }
          example: 'limit=100, remaining=0, reset=42'
        RateLimit-Policy:
          description: The limit and the window length in seconds (`100;w=60`), sent on every authenticated response.
          schema: { type: string }
          example: '100;w=60'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            default:
              value:
                error: RATE_LIMITED
                message: Rate limit exceeded. Retry after 30 seconds.
                detail: { retryAfter: 30 }
    VideoUnavailable:
      description: |
        The request renders MP4, and MP4 video is turned off on this
        server (`VIDEO_UNAVAILABLE`). Render png, jpeg, webp or pdf
        instead. Nothing was queued and no credits were charged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            error: VIDEO_UNAVAILABLE
            message: 'MP4 video is turned off on this server. Render png, jpeg, webp or pdf instead. No credits were charged.'
    PaymentRequired:
      description: |
        Not enough credits. `QUOTA_EXCEEDED` means the organization's plan
        is used up for this period (or the subscription isn't active);
        `WORKSPACE_QUOTA_EXCEEDED` means this workspace has reached the
        cap an organization admin set for it; `AI_CREDITS_EXCEEDED` (renders
        with AI layers or `translate`, and AI endpoints) means the
        organization's AI credits are used up. No credits are charged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            quota:
              value:
                error: QUOTA_EXCEEDED
                message: 'Quota exceeded: requested 3, remaining 1 of 100'
                detail:
                  planCode: free
                  used: 99
                  quotaPerPeriod: 100
                  requested: 3
                  remaining: 1
                  periodEnd: '2027-01-01T00:00:00.000Z'
            workspaceCap:
              value:
                error: WORKSPACE_QUOTA_EXCEEDED
                message: 'Workspace quota exceeded: requested 3, remaining 0 of 500'
                detail:
                  limit: 500
                  used: 500
                  requested: 3
                  remaining: 0
                  periodEnd: '2027-01-01T00:00:00.000Z'
    ValidationError:
      description: |
        The request body or query was invalid: a malformed body, a page
        that doesn't exist (`includePages` or a `pageN@` key), a style
        property the layer type doesn't support, a non-numeric value for a
        numeric property, more than 20 pages, or a video longer than the
        plan allows (30 seconds on Free, 60 on paid plans).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            badBody:
              value:
                error: VALIDATION_ERROR
                message: Invalid render request
                detail:
                  issues:
                    - code: invalid_type
                      path: [templateId]
                      message: 'Invalid input: expected string, received undefined'
            badPage:
              value:
                error: VALIDATION_ERROR
                message: 'includePages: the template has 3 page(s)'
                detail: { missing: [4] }
            badProperty:
              value:
                error: VALIDATION_ERROR
                message: '"photo.color": "color" can''t be set on a image layer'
    RenderFailed:
      description: The renderer failed. No credits were charged; retrying is safe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            default:
              value:
                error: INTERNAL
                message: The render failed. No credits were charged.
    WebhookUrlInvalid:
      description: |
        The webhook URL failed validation (a private or loopback address,
        an unsupported scheme, or not a URL), or `events` was empty or
        held an unknown event type.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            private:
              value:
                error: WEBHOOK_URL_INVALID
                message: url must not target a private host
            scheme:
              value:
                error: WEBHOOK_URL_INVALID
                message: url must use https://
            events:
              value:
                error: VALIDATION_ERROR
                message: 'Unknown event type "design.published". Supported: design.created, design.updated, design.deleted, render.completed, render.failed, social.post.published, social.post.failed.'
                detail: { field: events }
    WebhookLimitReached:
      description: |
        The workspace has reached the cap of 20 webhook subscriptions.
        Delete an unused subscription and try again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            default:
              value:
                error: WEBHOOK_LIMIT_REACHED
                message: 'Each workspace can have at most 20 webhook subscriptions. Delete an unused subscription and try again.'
                detail: { limit: 20, current: 20 }
