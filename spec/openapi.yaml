                  data: { $ref: '#/components/schemas/DesignGenerateJob' }
              examples:
                running:
                  value: { data: { jobId: cmw9uoeb9000binw52g648888, status: running, createdAt: '2026-11-10T09:12:44.000Z', finishedAt: null } }
                failed:
                  value:
                    data:
                      jobId: cmw9uoeb9000binw52g648888
                      status: failed
                      error: { error: AI_CREDITS_EXCEEDED, message: Your AI credits for this period are used up }
                      createdAt: '2026-11-10T09:12:44.000Z'
                      finishedAt: '2026-11-10T09:12:45.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /designs/import/figma:
    get:
      tags: [Figma import]
      operationId: getFigmaImportInfo
      summary: Check a key for the Figma plugin
      description: |
        The API key's workspace and organization, and the limits an import
        must respect. The Figma plugin calls it when connecting.
      responses:
        '200':
          description: The workspace and the limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FigmaImportInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Figma import]
      operationId: importFigma
      summary: Import Figma frames as templates
      description: |
        Turns the Figma plugin's export (frames, layers bottom to top, and
        their image/SVG files) into a template of the key's workspace: one
        page per frame (`mode: pages`, default) or one template per frame
        (`mode: separate`). Layers named `{{key}}` or `#key` in Figma carry
        a `param` and become the template's parameters.

        Send `multipart/form-data` with a `document` field (the document as
        JSON) and one file part per asset, named after the asset's `id`; or
        `application/json` with the document itself and each asset's bytes
        as base64 `data` (bodies up to 5 MB).

        Files are checked by content (PNG, JPEG, GIF, WebP, or SVG under the
        brand library's rules) and stored in the brand library, tagged
        `figma` and the template's name. Fonts are matched to the built-in
        Google Fonts, the brand library, or Google Fonts (added to the
        library unless `options.importFonts` is false), else a fallback.
        Nothing is stored unless every file passes. Each new design sends a
        `design.created` webhook.

        Limits: 20 frames, 1,000 layers a frame (5,000 in all), 300 files,
        10 MB a raster image, 5 MB an SVG, 1 MB a thumbnail, 60 MB of files
        in all, 30 imports per workspace per 10 minutes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  description: The `FigmaImportDocument` as JSON (at most 4 MB).
              additionalProperties:
                type: string
                format: binary
                description: One file per asset, the field named after the asset id.
          application/json:
            schema: { $ref: '#/components/schemas/FigmaImportDocument' }
      responses:
        '201':
          description: The template(s) created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FigmaImportResult' }
              examples:
                post:
                  value:
                    designs:
                      - id: clx8m2k3p0004abcd1234efgh
                        name: Summer sale post
                        orientation: portrait
                        createdAt: '2026-11-10T09:12:44.000Z'
                        updatedAt: '2026-11-10T09:12:44.000Z'
                        pages: 1
                        animated: false
                        editorUrl: https://app.jamframe.com/designs/clx8m2k3p0004abcd1234efgh/edit
                        parameters:
                          - { key: photo, type: image, pages: [1], example: 'https://cdn.jamframe.com/workspaces/ws/images/a1.png' }
                          - { key: headline, type: text, pages: [1], example: Summer Sale is here }
                    fonts:
                      - { family: Poppins, status: google, usedFamily: Poppins }
                      - { family: SF Pro Display, status: fallback, usedFamily: Inter, note: 'Not a Google Font and not in the brand library: drawn in Inter.' }
                    assets: { stored: 3, bytes: 245911 }
                    warnings:
                      - frame: Instagram post
                        layer: '{{headline}}'
                        message: 'Text with several styles kept its main style (Poppins Bold 88px #111827); colour of the rest flattened'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: A file, the files together, or the request is over its cap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: VALIDATION_ERROR, message: 'A file is larger than 10 MB (field "a1")' }
        '415':
          description: The body is neither `multipart/form-data` nor `application/json`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /webhooks/subscriptions:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: |
        Returns every webhook subscription in the API key's workspace,
        newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions, pagination]
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Subscribe to events
      description: |
        Register a URL to receive POSTs when the specified events happen
        in this workspace. The response includes a one-time
        `signingSecret`: store it immediately, it can't be recovered
        later. URL constraints:

        - Must be `https://` in production.
        - Must not resolve to a loopback, link-local, or private address
          (re-checked after DNS on every delivery to defeat rebinding).
        - At most 20 subscriptions per workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionInput' }
            examples:
              zapier:
                summary: Zapier REST Hooks subscribe
                value:
                  url: https://hooks.zapier.com/hooks/catch/123/abcdef/
                  events:
                    - design.created
              allEvents:
                summary: Subscribe to every event type
                value:
                  url: https://example.com/jamframe-webhook
                  events:
                    - design.created
                    - design.updated
                    - design.deleted
                    - render.completed
                    - render.failed
                    - social.post.published
                    - social.post.failed
      responses:
        '201':
          description: Subscription created. `signingSecret` is shown ONCE.
          content:
            application/json:
              schema:
                type: object
                required: [subscription, signingSecret]
                properties:
                  subscription: { $ref: '#/components/schemas/WebhookSubscription' }
                  signingSecret:
                    type: string
                    description: |
                      Raw HMAC signing secret. Returned here exactly once;
                      the server keeps its own copy for signing outbound
                      requests but never reveals it again.
                    example: wh_sec_AbCdEfGh01234567890abcdefghijKLMN
        '400': { $ref: '#/components/responses/WebhookUrlInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/WebhookLimitReached' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /webhooks/subscriptions/{id}:
    get:
      tags: [Webhooks]
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Unsubscribe
      description: |
        Deletes the subscription. Used by Zapier and Make as the REST
        Hooks "unsubscribe" call; calling it directly has the same
        effect. Returns `204 No Content` on success.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /webhooks/subscriptions/{id}/test:
    post:
      tags: [Webhooks]
      operationId: testWebhookSubscription
      summary: Send a sample event
      description: |
        Queues a sample delivery for the requested event type so you can
        check your endpoint and pull a sample payload. The delivery goes
        through the normal dispatcher: signature, headers and retries are
        the same as for a real event. The sample uses an obviously fake
        design id (`sample_design_id`).

        If `eventType` is omitted, the first event the subscription
        listens for is used. Returns `202 Accepted` once the delivery is
        queued; the outbound POST happens asynchronously.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType: { $ref: '#/components/schemas/WebhookEventType' }
            examples:
              default:
                value: { eventType: design.created }
      responses:
        '202':
          description: Delivery queued. The dispatcher will POST it shortly.
          content:
            application/json:
              schema:
                type: object
                required: [delivery, sample]
                properties:
                  delivery:
                    type: object
                    required: [id, eventType, createdAt]
                    properties:
                      id:
                        type: string
                        description: Delivery id, sent as `X-Webhook-Delivery`.
                      eventType: { $ref: '#/components/schemas/WebhookEventType' }
                      createdAt: { type: string, format: date-time }
                  sample: { $ref: '#/components/schemas/WebhookEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /webhooks/subscriptions/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSubscriptionSecret
      summary: Rotate the signing secret
      description: |
        Generates a new HMAC signing secret for this subscription and
        returns it. Update your verifier immediately: deliveries signed
        after this call use the new secret, and the old one stops working
        at once.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: Rotated. `signingSecret` is shown ONCE.
          content:
            application/json:
              schema:
                type: object
                required: [subscription, signingSecret]
                properties:
                  subscription: { $ref: '#/components/schemas/WebhookSubscription' }
                  signingSecret: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /social/accounts:
    get:
      tags: [Social]
      operationId: listSocialAccounts
      summary: List connected social accounts
      description: |
        The social accounts connected to the API key's workspace. Accounts
        are connected in the app (each platform's OAuth needs a browser).
        An account with `status: needs_reconnect` can't post until it is
        reconnected there; `sandbox` accounts (development servers without
        platform keys) simulate posting.
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/SocialAccount' }
              example:
                accounts:
                  - id: clx9a1b2c0001abcd1234efgh
                    platform: linkedin
                    platformName: LinkedIn
                    name: Ada Lovelace
                    username: null
                    avatarUrl: https://media.licdn.com/dms/image/sample.jpg
                    status: active
                    statusReason: null
                    sandbox: false
                    reconnectBy: '2027-01-08T10:00:00.000Z'
                    createdAt: '2026-11-09T10:00:00.000Z'
                    lastPostedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /social/posts:
    post:
      tags: [Social]
      operationId: createSocialPost
      summary: Create a social post (render and post)
      description: |
        Post to one or more connected accounts, now, at `scheduledAt`, or
        as a draft. The media is one of:

        - `templateId` + `modifications` + `response`: the template is
          rendered (as `POST /render` would) when the post goes out, and the
          render is charged as usual. Several pages become a carousel where
          the platform has one; a `pdf` posts as a LinkedIn document.
        - `renderId`: the stored files of an earlier render.
        - `mediaUrls`: image, video or PDF URLs, downloaded once now.

        Every account is checked against its platform's limits first
        (formats, counts, sizes, aspect ratios, durations, caption length).
        If any account can't take the post, nothing is created and the
        answer lists the problems per account in `detail.targets`. Drafts
        are saved anyway, with the problems in `checks`.

        Publishing is asynchronous: each account (`targets[]`) goes
        `queued` → `rendering` → `publishing` → `published` or `failed` on
        its own; one platform failing never blocks the others. Poll
        `GET /social/posts/{id}`, or subscribe to the `social.post.published`
        and `social.post.failed` webhook events. Posting itself costs no
        credits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialPostInput' }
            examples:
              renderAndPost:
                summary: Render a template and post it to three accounts
                value:
                  templateId: clx8m2k3p0004abcd1234efgh
                  modifications: { title: Spring sale, price: $29 }
                  response: { format: jpeg, includePages: [1, 2, 3] }
                  accounts:
                    - clx9a1b2c0001abcd1234efgh
                    - clx9a1b2c0002abcd1234efgh
                    - id: clx9a1b2c0003abcd1234efgh
                      options: { privacyLevel: SELF_ONLY }
                  caption: 'Spring sale starts today #sale'
                  captions: { x: Spring sale today. 30% off everything. }
                  options: { linkedin: { firstComment: 'Shop: https://example.com' } }
                  scheduledAt: '2026-11-10T09:00'
                  timezone: Europe/Paris
              existingRender:
                summary: Post an earlier render now
                value:
                  renderId: clx8n0q1r0009abcd1234efgh
                  accounts: [clx9a1b2c0001abcd1234efgh]
                  caption: New template, new look
      responses:
        '201':
          description: The post was created (and queued, scheduled or saved as a draft).
          headers:
            Location:
              description: '`/v1/social/posts/{id}`'
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [post, checks]
                properties:
                  post: { $ref: '#/components/schemas/SocialPost' }
                  checks:
                    type: array
                    description: Accounts with warnings (and, for drafts, the errors to fix before posting).
                    items: { $ref: '#/components/schemas/SocialTargetIssues' }
        '400':
          description: |
            Invalid request, or accounts that can't take this media.
            `detail.targets` lists every account's errors and warnings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: VALIDATION_ERROR
                message: 'Acme (Instagram): Instagram accepts JPEG images; the image is PNG. Render with format "jpeg".'
                detail:
                  targets:
                    - accountId: clx9a1b2c0001abcd1234efgh
                      platform: instagram
                      accountName: Acme
                      errors:
                        - level: error
                          code: image_format
                          message: 'Instagram accepts JPEG images; the image is PNG. Render with format "jpeg".'
                      warnings: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: An unknown template, render or account in this workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: NOT_FOUND
                message: 'Unknown social account(s) in this workspace: clx9a1b2c0009abcd1234efgh'
                detail: { missing: [clx9a1b2c0009abcd1234efgh] }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/VideoUnavailable' }
    get:
      tags: [Social]
      operationId: listSocialPosts
      summary: List social posts
      description: Newest first, with every account's status.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: status
          description: |
            `queue` (scheduled or going out), `drafts`, `published` (fully
            or partly), `attention` (failed or partly failed), `canceled`,
            or a single post status.
          schema: { type: string }
      responses:
        '200':
          description: A page of posts.
          content:
            application/json:
              schema:
                type: object
                required: [posts, pagination]
                properties:
                  posts:
                    type: array
                    items: { $ref: '#/components/schemas/SocialPost' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /social/posts/{id}:
    get:
      tags: [Social]
      operationId: getSocialPost
      summary: Get a social post
      parameters:
        - $ref: '#/components/parameters/SocialPostId'
      responses:
        '200':
          description: The post, with each account's status, permalink and error.
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post: { $ref: '#/components/schemas/SocialPost' }
              example:
                post:
                  id: clx9p0s1t0001abcd1234efgh
                  status: partial
                  caption: 'Spring sale starts today #sale'
                  captions: {}
                  options: {}
                  media:
                    - kind: image
                      contentType: image/jpeg
                      url: https://cdn.jamframe.com/renders/ws_abc123/0b1c-p1.jpg?Expires=1794229500&Key-Pair-Id=K2JCJMDEHXQW5F&Signature=Yq0nRZ3x~Gd5WQ__
                      expiresAt: '2026-11-09T13:05:00.000Z'
                      bytes: 182044
                      width: 1080
                      height: 1350
                  mediaSource: { kind: render, templateId: clx8m2k3p0004abcd1234efgh, response: { format: jpeg } }
                  renderJobId: clx8n0q1r0008abcd1234efgh
                  renderId: clx8n0q1r0009abcd1234efgh
                  scheduledAt: null
                  timezone: null
                  source: api
                  error: null
                  createdAt: '2026-11-09T12:00:00.000Z'
                  updatedAt: '2026-11-09T12:00:09.000Z'
                  finishedAt: '2026-11-09T12:00:09.000Z'
                  targets:
                    - id: clx9t0a1b0001abcd1234efgh
                      accountId: clx9a1b2c0001abcd1234efgh
                      platform: linkedin
                      accountName: Acme
                      status: published
                      caption: 'Spring sale starts today #sale'
                      permalink: https://www.linkedin.com/feed/update/urn:li:share:7000000000000000000/
                      externalId: urn:li:share:7000000000000000000
                      error: null
                      warnings: []
                      attempts: 0
                      nextAttemptAt: null
                      publishedAt: '2026-11-09T12:00:07.000Z'
                    - id: clx9t0a1b0002abcd1234efgh
                      accountId: clx9a1b2c0002abcd1234efgh
                      platform: x
                      accountName: acme
                      status: failed
                      caption: 'Spring sale starts today #sale'
                      permalink: null
                      externalId: null
                      error: { kind: permanent, code: http_403, message: 'X: You are not permitted to perform this action.' }
                      warnings: []
                      attempts: 0
                      nextAttemptAt: null
                      publishedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /social/posts/{id}/cancel:
    post:
      tags: [Social]
      operationId: cancelSocialPost
      summary: Cancel a social post
      description: |
        Cancels a draft, a scheduled or queued post, or the accounts of a
        publishing post that haven't started. Accounts that already posted
        keep their post. A render already running finishes (and is
        charged).
      parameters:
        - $ref: '#/components/parameters/SocialPostId'
      responses:
        '200':
          description: The post after canceling.
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post: { $ref: '#/components/schemas/SocialPost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The post is already finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: CONFLICT, message: This post is already published }
        '429': { $ref: '#/components/responses/RateLimited' }

  /social/posts/{id}/retry:
    post:
      tags: [Social]
      operationId: retrySocialPost
      summary: Retry failed accounts of a post
      description: |
        Queues the failed accounts again (all of them, or `targetId`).
        When the render failed, it runs again (and is charged when it
        succeeds). An account that needs reconnecting must be reconnected
        in the app first.
      parameters:
        - $ref: '#/components/parameters/SocialPostId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targetId: { type: string, description: One account target to retry. }
      responses:
        '200':
          description: The post, with the accounts queued again.
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post: { $ref: '#/components/schemas/SocialPost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Nothing failed, or the account was removed or needs reconnecting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: CONFLICT, message: 'Nothing to retry: no account of this post failed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /social/analytics/overview:
    get:
      tags: [Social]
      operationId: getSocialAnalyticsOverview
      summary: Social analytics totals
      description: |
        What the workspace's posts gained in the range (impressions or
        views, reach, likes, comments, shares, saves, clicks and engagement),
        the same for the period of equal length just before, and the change
        in percent. Covers posts made through the API or the app and the
        accounts' recent posts imported when they connected. A metric is
        `null` when the platforms in scope don't report it, never a stand-in
        0; `available` lists the ones they do. Days are in the
        organization's analytics time zone; the range is limited to the
        plan's history (`range.limited`).
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
        - $ref: '#/components/parameters/AnalyticsAccountId'
      responses:
        '200':
          description: Totals for the range and the period before.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialAnalyticsOverview' }
              example:
                range: { from: '2026-10-14', to: '2026-11-10', days: 28, timezone: Europe/Paris, historyDays: 90, limited: false }
                previousRange: { from: '2026-09-16', to: '2026-10-13' }
                available: [impressions, reach, likes, comments, shares, saves, engagement]
                totals: { impressions: 48210, reach: 30122, likes: 2210, comments: 140, shares: 96, saves: 310, clicks: null, engagement: 2756 }
                previous: { impressions: 39870, reach: 25010, likes: 1905, comments: 120, shares: 70, saves: 260, clicks: null, engagement: 2355 }
                change: { impressions: 20.9, reach: 20.4, likes: 16, comments: 16.7, shares: 37.1, saves: 19.2, clicks: null, engagement: 17 }
                engagementRate: 5.72
                postsPublished: 12
                previousPostsPublished: 9
        '400': { $ref: '#/components/responses/AnalyticsBadQuery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /social/analytics/daily:
    get:
      tags: [Social]
      operationId: getSocialAnalyticsDaily
      summary: Social analytics per day
      description: |
        One row per day of the range: what the workspace's posts gained that
        day (whenever they were published), and how many posts went out.
        A post's first numbers count on the day it was published.
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
        - $ref: '#/components/parameters/AnalyticsAccountId'
      responses:
        '200':
          description: The days of the range, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialAnalyticsDaily' }
              example:
                range: { from: '2026-11-09', to: '2026-11-10', days: 2, timezone: UTC, historyDays: 90, limited: false }
                available: [impressions, likes, comments, shares, saves, engagement]
                days:
                  - { day: '2026-11-09', impressions: 1820, reach: null, likes: 96, comments: 7, shares: 4, saves: 11, clicks: null, engagement: 118, postsPublished: 1 }
                  - { day: '2026-11-10', impressions: 640, reach: null, likes: 31, comments: 2, shares: 1, saves: 3, clicks: null, engagement: 37, postsPublished: 0 }
        '400': { $ref: '#/components/responses/AnalyticsBadQuery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /social/analytics/insights:
    get:
      tags: [Social]
      operationId: getSocialAnalyticsInsights
      summary: Social analytics insights
      description: |
        From the posts published in the range and their numbers so far: the
        5 top posts (by engagement, then impressions), the best weekday and
        hour to post (average engagement per post, from this workspace's own
        posts; a time needs 2 posts and the range 5 before one is called
        best), and a per-platform comparison.
      parameters:
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
        - $ref: '#/components/parameters/AnalyticsPlatform'
        - $ref: '#/components/parameters/AnalyticsAccountId'
      responses:
