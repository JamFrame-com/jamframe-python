  /designs/generate:
    post:
      tags: [AI]
      operationId: generateDesign
      summary: Generate a design with AI
      description: |
        The design agent designs a new template from a description and
        saves it in the API key's workspace: layout, sample copy, the
        workspace's brand kit (colours, fonts, logo from the brand library,
        unless `brand` says otherwise) and parameter keys on the layers a
        render will change (`title`, `photo`, `cta`…). Render it like any
        other design with `POST /render`.

        Costs its real AI cost plus half, **15 to 30 AI credits** per
        design (usually 15), refunded when the generation fails. A design usually takes 10–40 seconds: the call waits up to
        about 25 seconds and answers `201` with the design, or `202` with a
        job to poll at `GET /designs/generate/{jobId}` (the `Location`
        header). Send `"async": true` to get the `202` at once, and a
        `webhookUrl` to be called when the job ends instead of polling.

        On a development server without an AI key (`GET /ai/status` says
        `mock`), a scripted designer answers with a placeholder layout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignGenerateRequest' }
            examples:
              post:
                summary: An Instagram post with the workspace's brand kit
                value:
                  prompt: Announce our summer sale, 30% off everything this weekend. Bold and playful.
                  size: instagram-portrait
              carousel:
                summary: A five-slide LinkedIn carousel with explicit brand colours
                value:
                  prompt: Five tips for running better remote meetings
                  size: linkedin-carousel
                  pages: 5
                  brand: { colors: ['#0b1f4d', '#ff6b5b'], fonts: [Poppins, Inter] }
              async:
                summary: Answer at once and poll
                value: { prompt: A teaser video for our app launch, size: instagram-story, video: true, async: true }
      responses:
        '201':
          description: The design is ready and saved.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DesignGenerateJob' }
              example:
                data:
                  jobId: cmw9uoeb9000binw52g648888
                  status: succeeded
                  message: A bold coral and navy sale post with a photo slot, the headline, a subline and a "Shop now" button.
                  changes: ['Page 1: background #fff7ed', 'Added image "Photo"', 'Added text "Headline"']
                  creditsCharged: 5
                  mock: false
                  createdAt: '2026-11-10T09:12:44.000Z'
                  finishedAt: '2026-11-10T09:13:02.000Z'
                  design:
                    id: clx8m2k3p0002abcd1234efgh
                    name: Announce our summer sale, 30% off everything
                    orientation: portrait
                    pages: 1
                    animated: false
                    createdAt: '2026-11-10T09:13:02.000Z'
                    updatedAt: '2026-11-10T09:13:02.000Z'
                    parameters:
                      - { key: photo, type: image, pages: [1], example: '' }
                      - { key: title, type: text, pages: [1], example: Summer sale }
                    sizes: []
                    editorUrl: https://app.jamframe.com/designs/clx8m2k3p0002abcd1234efgh/edit
        '202':
          description: Still designing (or `async` was set). Poll the job.
          headers:
            Location:
              description: The job's URL.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [jobId, status]
                    properties:
                      jobId: { type: string }
                      status: { type: string, enum: [running] }
              example: { data: { jobId: cmw9uoeb9000binw52g648888, status: running } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: The AI didn't produce a usable design (`AI_BAD_OUTPUT`) or the provider failed (`AI_UPSTREAM_ERROR`). No credits were charged; retrying is safe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: AI_BAD_OUTPUT, message: "The AI didn't produce a design: try describing it differently" }
        '503':
          description: AI is not available on this server (`AI_UNAVAILABLE`). No credits were charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: AI_UNAVAILABLE, message: AI features are not available on this server, detail: { reason: no_key } }

