  /signed-urls:
    post:
      tags: [Signed URLs]
      operationId: createSignedUrl
      summary: Create a signed URL
      description: |
        Signs a render request into a public URL. Nothing is rendered or
        charged now: opening the URL renders the template (1 credit per
        image, or per PDF page) and answers with the file itself, so it
        works as an `<img src>`, in emails and as an `og:image`. Later
        requests for the same URL are served from the render cache for
        `cacheSeconds` (default 30 days) at no cost, as long as the
        template hasn't been saved since.

        The request is validated as a render would be: an unknown template
        is a `404`, an invalid modification a `400`; keys that match
        nothing come back in `warnings`. The template can be one of the
        workspace's or a template-library template.

        Images (`png`, `jpeg`, `webp`) show one page: page 1, or the one
        page in `response.includePages`. A PDF has every page, or those in
        `includePages`. Videos, `async` and `webhookUrl` aren't available
        for signed URLs.

        The URL can't be changed without breaking its signature (HMAC-SHA256
        under a per-workspace secret): any edit answers `403`. Once
        `expiresIn` has passed it answers `410`. To revoke every signed URL
        at once, call `POST /signed-urls/rotate-key`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignedUrlRequest' }
            examples:
              ogImage:
                summary: An Open Graph image, valid for 30 days
                value:
                  templateId: clx8m2k3p0001abcd1234efgh
                  modifications:
                    title: How we cut render times in half
                    author: Jane Doe
                    title.color: '#FFD400'
                  response: { format: png }
                  expiresIn: 2592000
      responses:
        '200':
          description: The signed URL. Nothing has been charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUrlResponse' }
              examples:
                default:
                  value:
                    data:
                      url: https://api.jamframe.com/r/s/cJa3HMV6TZzf.zPcqxCsIwFAXQXwnXNcjTpi3JLJ2cKn5ASR5JbJpIEVIo_XdxcT2cHR8Y2KXqpktTISIKvrZbfvHW-xYSDHPptbo2ndIkscDsCDy5FDPDYOTseGUnauAsypszO8j_ONuSygqD0zDcFBEk5mhn_tEj-sxOPMc7juML.kDVEKgTbbJVl2AuLI64vRg.png
                      templateId: clx8m2k3p0001abcd1234efgh
                      format: png
                      expiresAt: '2026-12-09T15:01:30.000Z'
        '400':
          description: |
            Invalid request: see `ValidationError`, plus `mp4`, `async`,
            `webhookUrl` or `response.type` (not available for signed
            URLs), more than one page for an image, or a URL that would be
            too long (send fewer or shorter modifications).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                video:
                  value: { error: VALIDATION_ERROR, message: 'Signed URLs render images and PDFs: "mp4" is not supported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /signed-urls/rotate-key:
    post:
      tags: [Signed URLs]
      operationId: rotateSignedUrlKey
      summary: Revoke all signed URLs
      description: |
        Replaces the workspace's URL-signing secret. Every signed URL
        created before stops working at once (`403`); URLs created after
        use the new secret. Revoking an API key does not revoke the signed
        URLs it created: rotate the key for that.
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rotatedAt]
                    properties:
                      rotatedAt: { type: string, format: date-time }
              examples:
                default:
                  value: { data: { rotatedAt: '2026-11-09T15:20:00.000Z' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /designs:
    get:
      tags: [Designs]
      operationId: listDesigns
      summary: List designs
      description: |
        Returns the templates in the API key's workspace, newest first.
        Read-only: templates are authored in the web app. Use this to
        populate a template picker, then `GET /designs/{id}` for the
        parameters of the chosen one. With `source=library` it lists the
        template-library presets instead, which any workspace can render
