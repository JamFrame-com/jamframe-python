openapi: 3.1.0
info:
  title: JamFrame API
  version: 1.0.0
  summary: Render images, carousels, PDFs and short videos from your templates.
  description: |
    The JamFrame REST API turns a template you designed in the JamFrame
    editor into finished files: a PNG, JPEG or WebP image, a multi-page
    carousel, a PDF, or an MP4 video of the animated pages. Send the
    template id and the values to fill in; get back a URL (or base64) for
    each file.

    Every request is authenticated with a per-workspace API key, created
    from the **API Keys** page in the web app.

    ## Authentication

    Send your key in the `Authorization` header as a bearer token:

    ```
    Authorization: Bearer jf_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    ```

    The key is bound to a single workspace; you don't need to pass a
    workspace id separately. Keys are shown exactly once when you create
    them: store them in a secrets manager, and rotate them by revoking and
    recreating.

    ## Rendering in three steps

    1. Find the template: `GET /designs` lists the workspace's templates.
    2. See what you can fill in: `GET /designs/{id}` returns the template's
       `parameters` (layer keys and `{{placeholders}}`) and page count.
    3. Render it: `POST /render` with the template id and `modifications`.

    Templates from the **template library** (the ready-made designs in the
    editor's Templates tab) can be rendered the same way: pass the library
    template's id as `templateId`, and `GET /designs/{id}` returns its
    parameters too. Credits are charged to your workspace, and the render
    log records the library template's id.

    ## File links

    Rendered files are private. With `response.type: "url"` (the default)
    each file comes back as a link that works for `expiresIn` seconds, a
    top-level field of the render request: 300 (5 minutes) by default, at
    most 604800 (7 days). `expiresAt`, next to `content`, says until when.
    A value outside that range is a `400 VALIDATION_ERROR`.

    - A render job keeps its `expiresIn`: every `GET /render-jobs/{id}`
      answers fresh links that work for that long from then, and the
      `render.*` webhook events and the `webhookUrl` callback carry links
      signed when they are sent.
    - `GET /renders` and `GET /renders/{id}` answer fresh links that work
      for 5 minutes.
    - Files are deleted **8 days** after the render, so a link never
      outlives its file.
    - **Need a permanent link?** Use a Dynamic URL (below): it renders the
      image when it is opened, serves it from the render cache afterwards,
      and works for as long as you keep it on.

    ## Signed and dynamic URLs

    Two ways to render from a plain link, with no API key in the page, for
    an `<img src>`, an email or an `og:image`:

    - **Signed URLs**: `POST /signed-urls` turns one render request into a
      tamper-proof link that renders it when opened (and serves it from the
      render cache afterwards, free). See `GET /r/s/{token}`.
    - **Dynamic URLs**: a template's public link, switched on in the app's
      Integrations, API & Forms dialog, that renders from its query parameters:
      `/r/d/{publicId}.png?headline=Hello`. It has a credit cap, a cache
      time and an expiry. See `GET /r/d/{file}`.

    Both answer with the file's bytes. A render costs credits as usual; a
    request served from the render cache costs nothing.

    ## Smart Resize

    One template renders at any size. `response.size` lays every page out
    at another size: a size saved on the template in the editor's
    **Resize** tab (its id, listed in `GET /designs/{id}` as `sizes`, with
    any manual adjustments), a size name (`story`, `square`, `portrait`,
    `landscape`, `widescreen`, `thumbnail`, `pin`, or a preset id such as
    `instagram-story` or `og-image`), `"WIDTHxHEIGHT"`, or `original`.
    A size the template hasn't saved is laid out automatically: backgrounds
    and photos fill the new canvas, edge decorations stay on their edge,
    and the content is scaled and re-centred. `response.sizes` renders
    several sizes in one call; `content` is then one entry per size,
    `[{ size, url | urls }]`. Credits are 1 per page per size.

    ### Modification keys

    | Key | Effect |
    | --- | --- |
    | `title` | Sets every layer whose parameter key is `title`, and every `{{title}}` placeholder in text. Text layers take new text, image layers an image URL, QR layers the encoded value, shape layers a fill colour. |
    | `page2@title` | The same, on page 2 only (pages are numbered from 1). |
    | `title.color` | Overrides one style property of the `title` layers. |
    | `page2@title.color` | Both: a style override on page 2 only. |

    Style properties by layer type:

    - any layer: `hidden`, `x`, `y`, `width`, `height`, `rotation`,
      `blendMode` (`normal`, `multiply`, `screen`, `overlay`, `darken`,
      `lighten`, `color-dodge`, `color-burn`, `hard-light`, `soft-light`,
      `difference`, `exclusion`, `hue`, `saturation`, `color`, `luminosity`),
      `shadowColor` (a CSS colour; a layer has a shadow when it is set),
      `shadowX`, `shadowY` (offset in px), `shadowBlur` (px, 0 or more).
      Text gets the shadow on its letters, other layers one that follows
      their shape.
    - text: `color`, `fontSize`, `fontFamily`, `fontWeight`, `italic`,
      `underline`, `align`, `lineHeight`, `letterSpacing`, `textTransform`,
      `shrinkToFit` (boolean: shrink the text, letter spacing included, until
      it fits its box instead of being cut off; never larger than `fontSize`;
      ignored on layers that grow with their text), `minFontSize` (the
      smallest size `shrinkToFit` may use, in px, greater than 0; default 40%
      of `fontSize`, at least 8), `backgroundColor` (fills the text's box),
      `verticalAlign` (`top`, `middle` or `bottom` in its box),
      `direction` (`auto`, `rtl` or `ltr`: the reading direction; `auto`,
      the default, takes each line's from its first letter, so Hebrew and
      Arabic read right to left; set `rtl` for a Hebrew line that starts
      with a Latin word),
      `textStrokeWidth` (an outline around the letters in px, 0 or more; 0
      is none; centred on their edges and drawn under the fill, so filled
      letters show half of it around them, transparent ones are hollow),
      `textStrokeColor` (default `#000000`)
    - image: `opacity`, `borderRadius`, `flipX`, `flipY`, `fit` (`contain` shows the whole picture; `cover` fills the frame and crops)
    - image and video: a mask, `mask` (a preset outline over the box: `star`,
      `triangle`, `diamond`, `circle`, `pentagon`, `hexagon`, `octagon`,
      `quarterCircle`, `roundedRectangle`, or `none`) or `maskAsset` (the id
      of an SVG in your brand library, used as the mask; `null` removes
      it), with `maskMode` (`alpha`: the SVG's shape shows the picture, the
      default; `luminance`: white shows, black hides). Masks never take a
      URL. The layer's border and shadow follow the mask.
    - image and video: colour effects, `effect` (`grayscale`, `sepia`,
      `vintage`, `warm`, `cool`, `fade`, `dramatic`, `noir`, `vivid`,
      `soft`, or `none`), then adjustments added to it: `blur` (px, 0–100),
      `brightness`, `contrast`, `saturation`, `temperature` (−100 to 100; 0
      leaves the picture as it is), `vibrance`, `whites`, `blacks` (0–100)
    - image: the crop, as fractions of the picture's own size: `cropX`,
      `cropY` (0–1), `cropWidth`, `cropHeight` (above 0, up to 1; left +
      width and top + height at most 1). A crop is kept when you send a new
      picture: one of the same aspect is framed the same; another aspect is
      placed by `fit` (`cover` fills the box around the crop's centre,
      `contain` shows the whole cropped part)
    - shape: `fill`, `stroke`, `strokeWidth`, `cornerRadius` (rectangles:
      corner radius in px, 0 or more, capped at half the shorter side),
      `strokeStyle` (`solid`, `dashed` or `dotted`)
    - qr: `foreground`, `background`
    - video: `fit` (`contain` or `cover`), `startAt` (seconds into the
      clip, 0 or more), `loop` (boolean), `opacity`, `borderRadius`
    - text, image, qr and video layers also take a border, drawn inside the
      box: `borderWidth` (px, 0 or more; 0 is none), `borderColor`,
      `borderStyle` (`solid`, `dashed` or `dotted`)

    A video layer's plain value replaces its clip URL. Video layers are
    always muted; a video's sound is the template's audio track:

    | Key | Effect |
    | --- | --- |
    | `audio` | Replaces the audio track's URL (mp3, m4a, wav or ogg). On a template without a track it adds one at full volume; `null` removes the track. |
    | `audio.volume` | The track's volume, from 0 to 1. |

    Subtitles burned into an MP4 are the template's subtitle track:

    | Key | Effect |
    | --- | --- |
    | `subtitles` | Replaces the cues: SRT or WebVTT text (up to 500 kB), a cue array `[{ "start": 1, "end": 3.2, "text": "…" }]` (seconds on the video's timeline, up to 5000 cues), or the `https` URL of an `.srt` / `.vtt` file (at most 1 MB). Styling tags are stripped. `null` or `""` removes them. |
    | `subtitles.style.<field>` | Restyles them: `fontFamily`, `fontWeight`, `fontSize`, `italic`, `lineHeight`, `textTransform` (`none`, `uppercase`), `color`, `background` (`""` for no box), `boxPadding`, `boxRadius`, `outlineColor`, `outlineWidth`, `position` (`bottom`, `middle`, `top`), `margin`, `maxWidth` (0.2–1 of the width), `maxLines` (1–3), `align`, `highlight` (`none`, `word`: the word being spoken takes `highlightColor`), `highlightColor`. |

    A layer's animation (`timing`) and a page's transition can't be changed
    through `modifications`.

    Numeric properties accept numbers or strings such as `"48px"`; boolean
    properties accept `true`/`false` (or `"true"`, `1`, `"1"`). `null`
    clears a value. Keys that match nothing in the template don't fail the
    render: they come back in `warnings` so you can catch typos.

    ### AI layers and translation

    A text or image layer can be filled by AI when it renders (set up in
    the editor's AI section). Its prompt's `{{placeholders}}` are filled
    from the render's values first, and results are cached per workspace:
    a repeat with the same prompt and values costs no AI credits.

    | Key | Effect |
    | --- | --- |
    | `headline.prompt` | The prompt of the `headline` layers (any text or image layer with a parameter key takes one). `""` turns their AI off. |
    | `headline.tone`, `headline.maxWords` | Text layers: the tone of voice, and at most this many words (1–300). |
    | `photo.style`, `photo.reference` | Image layers: the visual style, and an image URL to edit instead of generating from scratch. The picture is made at the aspect ratio of the layer's box. |
    | `headline` | A plain value skips the AI for those layers: the value is used as is. |

    Top-level `"translate": true` with `"lang": "es"` (any BCP 47 tag)
    translates every text layer's final text, prompt layers included
    (usually in one AI call); placeholders, links and numbers are kept as
    they are. `"ai": { "onError": "fallback" }` renders the layers' saved
    text and images when the AI fails, instead of failing the render.

    Per render (all pages and sizes): at most 50 different text prompts,
    10 different image prompts, 3000 characters per prompt once its
    placeholders are filled, and 50,000 characters of text to translate;
    more is a `400`.

    AI runs only in authenticated renders (API keys, the app, MCP, render
    jobs). Signed and dynamic URLs and template forms render the layers'
    saved text and images, and treat AI keys as unknown. AI credits are a
    separate pool (see `GET /ai/status`): 1 per 500 words written or
    translated, 4 per image, charged once per render and only when it
    succeeds; `data.aiCredits` says how many. An AI failure fails the
    render with its `AI_*` code and charges nothing.

    ## Videos and render jobs

    `response.format: "mp4"` renders the template's pages as one video:
    each page is a scene shown for its duration (set per page in the
    editor, 5 seconds by default), with the layers' animations, video
    layers, the template's audio track and its subtitles. H.264 at 30 fps.
    Scenes of a different size from the first page are scaled to fit and
    letterboxed.

    A page can have a **transition** into the next scene (crossfade, fade
    through black, slides, wipes, zoom, circle; set in the editor). A
    transition overlaps its two scenes, so the video is shorter than the
    pages added up by each transition's duration: two 4 s pages with a
    0.5 s crossfade make a 7.5 s video. The video's length is the MP4's,
    and that's what's billed.

    How long a video can be depends on the plan: 30 seconds on Free, 60 on
    Starter, Plus and Professional. Long videos are rendered in chunks side
    by side and can take longer than the 90 seconds a synchronous request
    waits, so send them with `"async": true` (or poll the job a synchronous
    request hands back).

    `"response": { "format": "mp4", "subtitles": "srt" }` (or `"vtt"`) also
    returns the subtitles as a file next to the video, in `data.subtitles`.

    Videos run as **render jobs**, and so does any render sent with
    `"async": true`:

    - With `"async": true` the API answers at once with
      `202 { "data": { "jobId": "…", "status": "queued" } }`. Poll
      `GET /render-jobs/{id}` until `status` is `succeeded` or `failed`.
    - An MP4 request without `async` waits up to 90 seconds for its job and
      answers `200` with the usual render body (plus `duration`), or
      `202` as above if the video isn't ready yet.
    - Add `"webhookUrl"` to have the finished job POSTed to you
      (`{ "event": "render.completed", "job": { … } }`), and subscribe to the
      `render.completed` and `render.failed` webhook events for every job
      in the workspace.

    Images and PDFs stay synchronous unless you send `"async": true`.

    ## Credits

    A render costs **1 credit per image or PDF page**: a single image is
    1 credit, a 5-slide carousel 5 credits, a 3-page PDF 3 credits. A
    video costs **1 credit per second** of output, rounded up (a 12.5 s
    video costs 13 credits; a transition, which overlaps two scenes, takes
    its duration off the video and the bill). Subtitles and their sidecar
    file cost nothing extra. Credits are charged only after the render
    succeeds; a failed render (or render job) costs nothing. Listing and
    reading templates, listing renders, reading render jobs, and managing
    webhooks are free.

    If the organization's plan can't cover a render, it is refused up front
    with `402 QUOTA_EXCEEDED` (or `402 WORKSPACE_QUOTA_EXCEEDED` when an
    organization admin has capped this workspace's share).

    AI features spend **AI credits**, a separate pool per billing period
    with its own price list (for example 5 per AI image, 1 per 500
    characters of voiceover, 10 per second of AI video at 720p); a failed AI call
    is refunded. `GET /ai/status` shows the price list and what is left;
    an exhausted pool answers `402 AI_CREDITS_EXCEEDED`.

    ## Errors

    All non-2xx responses use a single envelope:

    ```json
    { "error": "QUOTA_EXCEEDED", "message": "...", "detail": { ... } }
    ```

    The `error` code is stable and machine-readable; the `message` is safe
    to show to end users; the optional `detail` object carries structured
    context (for example the remaining credits for `QUOTA_EXCEEDED`).

    ## Rate limits

    Requests are limited per **organization**, per minute, by plan: 100 on
    Free and Starter, 200 on Plus and Professional. All of an
    organization's API keys share the budget. Every authenticated response
    carries the IETF rate-limit headers (draft 7), so clients can throttle
    themselves:

    - `RateLimit: limit=100, remaining=87, reset=42`: requests allowed per
      window, requests left in this one, and seconds until it resets.
    - `RateLimit-Policy: 100;w=60`: the limit and the window in seconds.

    The older separate `RateLimit-Limit` / `RateLimit-Remaining` /
    `RateLimit-Reset` and `X-RateLimit-*` headers are not sent. Exceeding
    the limit returns `429 RATE_LIMITED` with a `Retry-After` header (in
    seconds). Some endpoints have extra limits per workspace (design
    generation, Figma imports, background removal).

    ## Outbound webhooks

    Instead of polling, register a webhook subscription and JamFrame will
    POST signed JSON to your URL when events happen in your workspace.

    ### Event types

    - `design.created`: a template was created in the workspace.
    - `design.updated`: a template was saved.
    - `design.deleted`: a template was deleted.
    - `render.completed`: a render job (an MP4, or an `"async": true`
      render) succeeded.
    - `render.failed`: a render job failed. No credits were charged.
    - `social.post.published`: a social post went out on one of its
      accounts (with its permalink).
    - `social.post.failed`: a social post failed on one of its accounts,
      after its retries (with the reason).
    - `workflow.run.completed`: a workflow run finished with at least one
      row through (`succeeded` or `partial`, or canceled).
    - `workflow.run.failed`: a workflow run failed (no row went through,
      or the source could not be read).

    A `design.*` event's `data` is the template summary (the `Design`
    schema); a `render.*` event's `data` is the render job (the `RenderJob`
    schema); a `social.post.*` event fires once per account of the post and
    its `data` is `{ post, target }` (the `SocialPostEvent` schema); a
    `workflow.run.*` event's `data` is the run (the `WorkflowRun` schema)
    plus `workflowName`.

    ### Subscribe and unsubscribe

    ```bash
    # Create a subscription (returns the signing secret ONCE)
    curl -X POST https://api.jamframe.com/v1/webhooks/subscriptions \
      -H "Authorization: Bearer jf_live_..." \
      -H "Content-Type: application/json" \
      -d '{ "url": "https://hooks.zapier.com/...", "events": ["design.created"] }'

    # Delete a subscription (also what Zapier and Make call when a Zap is deleted)
    curl -X DELETE https://api.jamframe.com/v1/webhooks/subscriptions/{id} \
      -H "Authorization: Bearer jf_live_..."
    ```

    ### Delivery headers

    | Header | Value |
    | --- | --- |
    | `X-Webhook-Event` | The event type, e.g. `design.updated`. |
    | `X-Webhook-Delivery` | Delivery id: unique per subscription and event, unchanged across retries. Use it as your idempotency key. |
    | `X-Webhook-Timestamp` | Unix seconds when this attempt was signed. |
    | `X-Webhook-Signature` | `t=<unixSeconds>,v1=<hexHmacSha256>` |
    | `User-Agent` | `JamFrame-Webhook/1` |

    ### Signature verification

    `v1` is the HMAC-SHA256 of `${t}.${rawRequestBody}`, keyed with the
    subscription's signing secret. Verify against the **raw** body (re-
    serialising the JSON changes the bytes) and reject requests where
    `|now - t| > 300` seconds to defeat replays.

    ```js
    const crypto = require("node:crypto");
    function verify(rawBody, signatureHeader, secret) {
      const parts = Object.fromEntries(
        signatureHeader.split(",").map((p) => p.split("=")),
      );
      const expected = crypto
        .createHmac("sha256", secret)
        .update(`${parts.t}.${rawBody}`)
        .digest("hex");
      const ok = crypto.timingSafeEqual(
        Buffer.from(expected, "hex"),
        Buffer.from(parts.v1, "hex"),
      );
      const fresh = Math.abs(Date.now() / 1000 - Number(parts.t)) < 300;
      return ok && fresh;
    }
    ```

    ### Retries, idempotency, suspension

    - Deliveries are **at-least-once**: deduplicate on `X-Webhook-Delivery`.
    - Any 2xx is success. Anything else (including redirects, which are
      not followed) and timeouts (10 seconds) are retried with backoff:
      1m, 5m, 30m, 2h, 12h, 24h. After the 7th failed attempt the
      delivery is marked `failed`.
    - HTTP `410 Gone` is treated as the REST Hooks "unsubscribe" signal:
      the subscription is deleted, so you can subscribe the same URL again.
    - After 20 consecutive failures a subscription is `suspended`.
      Re-activate it from the **Webhooks** page in the web app after
      fixing your endpoint.
    - A subscription delivers as the person who created it: when they
      stop being an editor of the workspace (removed, left, demoted, grant
      lowered) it becomes `revoked`, for good, even if they get access
      back. Create a new one.

servers:
  - url: https://api.jamframe.com/v1
    description: Production
  - url: http://localhost:3100/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: |
      Test-authentication endpoint used by integrations (e.g. Zapier) to
      verify an API key and display a human-readable label for the
      connected workspace.
  - name: Render
    description: |
      Render a template into images, a carousel, a PDF or an MP4 video, at
      its own size or any other (Smart Resize: `response.size` and
      `response.sizes`). Each render costs 1 credit per image or PDF page,
      or 1 credit per second of video. Videos and `async` renders run as
      render jobs (`GET /render-jobs/{id}`). `GET /renders` lists past
      renders with their files. If video rendering is turned off, an MP4
      request answers `503 VIDEO_UNAVAILABLE` at once and charges nothing.
  - name: Signed URLs
    description: |
      Sign a render request into a public URL that renders it when opened.
      The URLs themselves are served at `/r/s/...` (see **Public URLs**).
  - name: Public URLs
    description: |
      Anonymous image and PDF URLs, served from the app's origin (not under
      `/api/v1`): signed URLs and dynamic URLs. They answer with the file's
      bytes; errors are a small JSON body (`PublicUrlError`). Limits per
      minute: 120 requests per IP and 1200 per URL; renders (cache misses)
      20 per IP, 30 per URL and 120 per workspace.
  - name: Public forms
    description: |
      A template's public self-serve form (`/f/<publicId>` in the app),
      made in the app's Integrations, API & Forms dialog: anyone with the
      link fills it in, sees a live preview and downloads the result. No
      authentication: the public id is the credential, and renders spend the form owner's
      credits within the form's credit cap. Served from the app's origin
      under `/api/public/forms` (not under `/api/v1`). Cloudflare Turnstile
      is required on render and on a visit's first upload when the server
      has it configured (a production server without it refuses both with
      `503 CAPTCHA_UNAVAILABLE`). Limits per minute: 120 requests per IP;
      renders 10 per IP, 30 per form and 120 per workspace; uploads 20 per
      IP (100 an hour) and 30 per form (300 an hour). Errors are
      `PublicFormError`. See docs/forms.md.
  - name: Designs
    description: |
      A **design** is a template authored in the JamFrame editor: one or
      more pages (a carousel, or a post plus a story) whose layers can be
      filled in through the API. Designs are made and edited in the web
      app; through the API you can also generate one with AI
      (`POST /designs/generate`), have a workflow create one, or import
      frames from Figma (**Figma import**).
  - name: Figma import
    description: |
      Create templates from Figma frames: the endpoints behind the Figma
      plugin (see `docs/figma-plugin.md` in the repository). The one way to
      create designs through the API; they are then rendered like any other.
      Both methods answer CORS for any origin (the plugin's iframe has a
      `null` origin; the credential is the bearer key, never a cookie).
  - name: Social
    description: |
      Post renders to connected social accounts (Instagram, Facebook
      Pages, LinkedIn profiles and pages, X, TikTok, YouTube, Pinterest,
      Bluesky, and Buffer channels): render a
      template and post it in one call, or post an earlier render or media
      URLs; now, scheduled in a time zone, or as a draft. Accounts are
      connected in the app. Posting costs no credits; renders cost the
      usual credits.
      Analytics (`/social/analytics/*`) reports how posts are doing:
      impressions, reach, likes, comments, shares, saves and clicks.
  - name: Workflows
    description: |
      Automations that read rows (Google Sheets, a CSV or XLSX file at a
      URL, an Airtable view, a Google Drive folder, or an incoming webhook's
      payload), filter and sort them, render a template per row (normal
      render credits) and deliver each render (its URL, an outgoing
      webhook, Slack, social posts, written back to the sheet, uploaded to
      Drive). Triggers: Run Now, a schedule, an incoming webhook, or new
      rows. Only `active` workflows fire on their own. Runs are
      asynchronous: start one, then poll it for each row's outcome. Plan
      limits apply to runs a month, workflows, steps per workflow, runs at
      once and rows per run (402 `PLAN_LIMIT_EXCEEDED`). See
      docs/workflows.md.
  - name: AI
    description: |
      Whether AI features are available on this server (`live`, `mock` on a
      development server without an AI key, or `off`), the models behind
      each task, the AI credit price list, and the organization's AI
      credits for the billing period. AI errors use the `AI_*` codes:
      `AI_UNAVAILABLE` (503), `AI_CONTENT_REFUSED` (422), `AI_TIMEOUT`
      (504), `AI_RATE_LIMITED` (429), `AI_BAD_OUTPUT` (502),
      `AI_BAD_REQUEST` (422), `AI_UPSTREAM_ERROR` (502) and
      `AI_CREDITS_EXCEEDED` (402). `POST /designs/generate` designs a new
      template with the design agent (15–30 AI credits).
      `POST /images/remove-background` cuts a picture out on a transparent
      background (1 AI credit) and `POST /ai/transcribe` turns speech into
      subtitle cues for `modifications.subtitles` (1 AI credit a minute).
  - name: Webhooks
    description: |
      Outbound webhooks deliver workspace events (`design.created`,
      `design.updated`, `design.deleted`, `render.completed`,
      `render.failed`, `social.post.published`, `social.post.failed`,
      `workflow.run.completed`, `workflow.run.failed`) to
      a URL you supply.
      Subscriptions are scoped to the API key's workspace; payloads are
      signed with HMAC-SHA256 (see "Outbound webhooks" in the
      introduction for verification and retry semantics).

x-tagGroups:
  - name: Rendering
    tags: [Render, Signed URLs, Public URLs, Public forms]
  - name: Templates
    tags: [Designs, AI, Figma import]
  - name: Automation
    tags: [Workflows, Social, Webhooks]
  - name: Account
    tags: [Auth]

paths:
  /auth:
    post:
      tags: [Auth]
      operationId: testAuth
      summary: Test API key
      description: |
        Verifies the bearer API key and returns a human-readable
        `username` for the connected workspace. Intended as Zapier's
        "Test Auth" / connection-label endpoint: a 2xx response confirms
        the key is valid and the returned `username` is safe to show in
        the integration UI.
      responses:
        '200':
          description: API key is valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
              examples:
                default:
                  value: { workspaceId: ws_abc123, username: Jane Doe }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /render:
    post:
      tags: [Render]
      operationId: renderTemplate
      summary: Render a template
      description: |
        Renders a template from the API key's workspace, or a template
        from the template library (by its id), with your values and returns
        the files. Library templates are charged to your workspace like your
        own, and the render log records the library template's id.

        - **Images** (`png`, `jpeg`, `webp`) give one file per page, so a
          multi-page template is a carousel. `content` is a single string
          when one file is produced and an array (in page order) when
          several are.
        - **PDF** gives one file containing every rendered page, so
          `content` is always a single string.
        - **MP4** gives one video with every rendered page as a scene, so
          `content` is a single URL, and `duration` gives its length in
          seconds (scene transitions overlap their scenes, so it can be
          less than the pages added up). At most 30 seconds on Free, 60 on
          Starter, Plus and Professional. With `response.subtitles`,
          `subtitles` is the URL of the subtitle file. If video rendering is
          turned off, an MP4 request is refused at once with
          `503 VIDEO_UNAVAILABLE`: nothing is queued or charged.

        Use `response.includePages` to render only some pages; at most 20
        pages can be rendered per request.

        **Smart Resize.** `response.size` renders every page at another
        size: a size saved on the template (its id), a size name such as
        `story` or `instagram-story`, `"WIDTHxHEIGHT"` (16 to 10000 px) or
        `original`; an unknown size is a `400` that lists the template's
        sizes. It works with every format, MP4 included (one size per
        video). `response.sizes` (up to 10) renders each size in one
        synchronous call and answers `content` as one entry per size, in
        the order asked: `{ size, name, width, height, pages, url }` for a
        single file (one page, or a PDF) or `urls` for a carousel. `sizes`
        can't be combined with `size`, `mp4`, `async` or `base64`; a size
        listed twice (also under another name, like `story` and
        `1080x1920`) is a `400`, and so is a call over 30 pages in all
        (pages × sizes). Cost: 1 credit per page per size.

        **Limits on what a render loads and makes.** Image and video URLs
        (in the template or in `modifications`) must be public `http(s)`
        addresses, `data:` URLs or the template library's own files: a
        private, loopback or link-local host (`localhost`, `10.x`,
        `169.254.169.254`, a `//host` path…) is a `400`, and a host name
        that resolves to such an address fails the render with a `422`
        (no credits charged). Each page's output is at most 36 megapixels
        (width × height × `scale`²), a `400` above that.

        With `response.type: "url"` (the default) each file is stored and
        `content` holds links to the files that work for `expiresIn`
        seconds (default 300, at most 604800 = 7 days); `expiresAt` says
        until when. The files are deleted 8 days after the render: for a
        permanent image link, use a Dynamic URL. With `"base64"` nothing is
        stored and `content` holds the raw base64 bytes (no `data:`
        prefix); base64 is only available for synchronous image and PDF
        renders, and takes no `expiresIn`.

        **Render jobs.** MP4 renders and requests with `"async": true` run
        as render jobs. With `"async": true` the answer is `202` with the
        job id at once (and a `Location` header pointing at the job). An
        MP4 request without `async` waits up to 90 seconds and then answers
        `200` with the render, or `202` with the job id if it is still
        running. Either way, `GET /render-jobs/{id}` reports progress and
        the result (with fresh links on every read, for the request's
        `expiresIn`), and `webhookUrl` (render jobs only) receives
        `{ "event", "job" }` when the job ends. A request that can't
        succeed (an unknown template, an invalid modification or subtitle
        file, a video over the plan's limit, not enough credits) is refused
        before anything is queued, with the same errors as a synchronous
        render.

        **AI layers and translation** (see the introduction): `.prompt`,
        `.tone`, `.maxWords`, `.style` and `.reference` keys, and top-level
        `translate` + `lang` and `ai.onError`. AI results are made once per
        request (every size, page and video frame shares them), cached per
        workspace, and charged in AI credits only when the render succeeds
        (`data.aiCredits`, 0 when everything came from the cache). An AI
        failure answers its `AI_*` code (`402 AI_CREDITS_EXCEEDED`, `422
        AI_CONTENT_REFUSED`, `503 AI_UNAVAILABLE`, …) and charges nothing,
        unless `"ai": { "onError": "fallback" }` asks for the saved text and
        images instead.

        **Print-ready and smaller PDFs (experimental).** With
        `"format": "pdf"`, `response.cmyk` converts the PDF's colours to
        CMYK for print with an ICC profile (text and shapes stay vector; the
        file is labelled PDF/X-4 when it qualifies), and `response.compress`
        makes the file smaller (images downsampled to a resolution, photos
        stored as JPEG). Both are off by default. They are experimental:
        their options and output may still change. They cost nothing extra.

        Cost: 1 credit per image or PDF page, or 1 credit per second of
        video (rounded up), charged only after a successful render.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderRequest' }
            examples:
              aiLayers:
                summary: AI layers, translated
                value:
                  templateId: clx8m2k3p0001abcd1234efgh
                  modifications:
                    product: Cold brew
                    headline.prompt: Write a 6-word headline about {{product}}
                    photo.prompt: A glass of {{product}} on a marble table, morning light
                    photo.style: photo
                  translate: true
                  lang: es
                  ai:
                    onError: fallback
              singleImage:
                summary: A single PNG
                value:
                  templateId: clx8m2k3p0001abcd1234efgh
                  modifications:
                    title: Summer sale ends Sunday
                    subtitle: Up to 50% off everything
                    photo: https://example.com/images/beach.jpg
                    title.color: '#FF4D4F'
                  response:
                    type: url
                    format: png
                    scale: 2
              longLink:
                summary: A PNG whose link works for 7 days
                value:
                  templateId: clx8m2k3p0001abcd1234efgh
                  modifications:
                    title: Summer sale ends Sunday
                  response:
                    format: png
                  expiresIn: 604800
              carousel:
                summary: A carousel with per-slide text
                value:
                  templateId: clx8m2k3p0002abcd1234efgh
                  modifications:
                    brand: Acme Coffee
                    title: 5 ways to brew better coffee
                    page2@title: 1. Grind just before brewing
                    page3@title: 2. Weigh your beans
                    page3@title.fontSize: 56
                  response:
                    format: jpeg
                    quality: 90
              pdf:
                summary: A two-page PDF
                value:
                  templateId: clx8m2k3p0003abcd1234efgh
                  modifications:
                    customer_name: Jane Doe
                  response:
                    format: pdf
                    includePages: [1, 2]
              printPdf:
                summary: A print-ready CMYK PDF, compressed (experimental)
                value:
                  templateId: clx8m2k3p0003abcd1234efgh
                  modifications:
                    customer_name: Jane Doe
                  response:
                    format: pdf
                    cmyk:
                      profile: fogra39
                    compress:
                      preset: printer
              video:
                summary: An MP4 video (waits up to 90 s)
                value:
                  templateId: clx8m2k3p0004abcd1234efgh
                  modifications:
                    title: New season, new menu
                    clip: https://example.com/videos/kitchen.mp4
                    audio: https://example.com/audio/upbeat.mp3
                    audio.volume: 0.6
                  response:
                    format: mp4
              story:
                summary: 'Smart Resize: the design as a 1080×1920 story'
                value:
                  templateId: clx8m2k3p0001abcd1234efgh
                  modifications:
                    title: Summer sale ends Sunday
                  response:
                    format: png
                    size: story
              everySize:
                summary: 'Smart Resize: several sizes in one call'
                value:
                  templateId: clx8m2k3p0001abcd1234efgh
                  modifications:
                    title: Summer sale ends Sunday
                  response:
                    format: png
                    sizes: [original, story, square, 1200x630]
              videoSubtitles:
                summary: An MP4 with subtitles from an SRT file, restyled, plus a .vtt copy
                value:
                  templateId: clx8m2k3p0004abcd1234efgh
                  modifications:
                    title: New season, new menu
                    subtitles: https://example.com/captions/new-menu.srt
                    subtitles.style.position: top
                    subtitles.style.highlight: word
                  response:
                    format: mp4
                    subtitles: vtt
              videoCues:
                summary: An MP4 with subtitles given as cues
                value:
                  templateId: clx8m2k3p0004abcd1234efgh
                  modifications:
                    subtitles:
                      - { start: 0.4, end: 3.2, text: Meet our new menu }
                      - { start: 3.5, end: 6.8, text: Every dish made fresh today }
                  response:
                    format: mp4
              asyncVideo:
                summary: An MP4 video as a render job, with a callback
                value:
                  templateId: clx8m2k3p0004abcd1234efgh
                  async: true
                  webhookUrl: https://hooks.example.com/jamframe/render-done
                  modifications:
                    title: New season, new menu
                  response:
                    format: mp4
      responses:
        '200':
          description: Rendered. Credits have been charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderResponse' }
              examples:
                singleImage:
                  summary: A single PNG
                  value:
                    data:
                      content: https://cdn.jamframe.com/renders/ws_abc123/5f0c6b0e-7d1a-4e8b-9c55-0d8f5f0a1b2c.png?Expires=1794225900&Key-Pair-Id=K2JCJMDEHXQW5F&Signature=Yq0nRZ3x~Gd5WQ__
                      expiresAt: '2026-11-09T12:05:00.000Z'
                      type: url
                      format: png
                      pages: [1]
                      credits: 1
                      renderId: clx8n0q1r0004abcd1234efgh
                      responseTime: 1840
                carousel:
                  summary: A three-slide carousel
                  value:
                    data:
                      content:
                        - https://cdn.jamframe.com/renders/ws_abc123/9a1e2b3c-4d5e-4f60-8a7b-1c2d3e4f5a6b-p1.jpg?Expires=1794225900&Key-Pair-Id=K2JCJMDEHXQW5F&Signature=Yq0nRZ3x~Gd5WQ__
                        - https://cdn.jamframe.com/renders/ws_abc123/9a1e2b3c-4d5e-4f60-8a7b-1c2d3e4f5a6b-p2.jpg?Expires=1794225900&Key-Pair-Id=K2JCJMDEHXQW5F&Signature=Yq0nRZ3x~Gd5WQ__
                        - https://cdn.jamframe.com/renders/ws_abc123/9a1e2b3c-4d5e-4f60-8a7b-1c2d3e4f5a6b-p3.jpg?Expires=1794225900&Key-Pair-Id=K2JCJMDEHXQW5F&Signature=Yq0nRZ3x~Gd5WQ__
                      expiresAt: '2026-11-09T12:05:00.000Z'
                      type: url
