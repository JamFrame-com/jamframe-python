          description: Top posts, best times and platforms.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialAnalyticsInsights' }
        '400': { $ref: '#/components/responses/AnalyticsBadQuery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /ai/status:
    get:
      tags: [AI]
      operationId: getAiStatus
      summary: AI availability, price list and AI credits
      description: |
        Whether AI features can run (`status`), the model each AI task uses,
        the AI credit price list, and the API key's organization's AI
        credits for the current billing period. Free to call.
      responses:
        '200':
          description: The AI status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiStatus' }
              example:
                status: live
                models:
                  design: anthropic/claude-sonnet-5.5
                  fast: anthropic/claude-haiku-5.5
                  vision: google/gemini-3.8-flash
                  image: google/gemini-nano-banana-2.1
                  imageEdit: google/gemini-nano-banana-2.1
                  background: openai/gpt-image-2.6-flare
                  tts: google/gemini-3.8-flash-tts
                  stt: openai/whisper-large-v3-turbo
                  video: google/veo-3.1-lite
                  embedding: openai/text-embedding-3-small
                prices:
                  - { operation: image, credits: 4, per: 1, unit: image, label: 'AI image, generated or edited, up to 1.5K' }
                  - { operation: tts, credits: 1, per: 500, unit: character, label: 'Voiceover, per 500 characters' }
                credits:
                  planCode: starter
                  used: 120
                  reserved: 0
                  limit: 500
                  remaining: 380
                  periodStart: '2026-11-01T00:00:00.000Z'
                  periodEnd: '2026-12-01T00:00:00.000Z'
