        '202':
          description: |
            Queued as a render job: an `async` request, or an MP4 still
            rendering after 90 seconds. Poll `GET /render-jobs/{jobId}`, or
            wait for the `webhookUrl` callback or the `render.*` webhook
            events. Credits are charged when the job succeeds.
          headers:
            Location:
              description: Path of the render job, e.g. `/v1/render-jobs/clx8n0q1r0008abcd1234efgh`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJobAccepted' }
              examples:
                queued:
                  value:
                    data: { jobId: clx8n0q1r0008abcd1234efgh, status: queued }
        '400':
          description: |
            The request body was invalid (see `ValidationError` for the
            common cases; also a video longer than the plan allows, text in
            `modifications.subtitles` (or the file it points to) that isn't
            SRT or WebVTT, `response.subtitles` without `mp4`, `base64` with
            an MP4 or `async` render, a `webhookUrl` on a synchronous
            render, or `expiresIn` outside 1–604800 or sent with `base64`),
            or `webhookUrl` failed validation
            (`WEBHOOK_URL_INVALID`: not http(s), or a private or loopback
            address).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                badBody:
                  value:
                    error: VALIDATION_ERROR
                    message: Invalid render request
                    detail:
                      issues:
                        - code: invalid_type
                          path: [templateId]
                          message: 'Invalid input: expected string, received undefined'
                tooLong:
                  value:
                    error: VALIDATION_ERROR
                    message: 'A video can be at most 60 seconds long on the free plan; the rendered pages add up to 70.5 seconds. Render fewer pages (includePages) or shorten them in the editor.'
                    detail: { seconds: 70.5, max: 60, planCode: free }
                badSubtitles:
                  value:
                    error: VALIDATION_ERROR
                    message: '"subtitles": SRT cue 2: expected a timing line (00:00:01,000 --> 00:00:03,500), found "00:00:03,000 -> 00:00:05,000"'
                badExpiresIn:
                  summary: A link time over 7 days
                  value:
                    error: VALIDATION_ERROR
                    message: 'expiresIn is how long the file links work, in whole seconds: from 1 to 604800 (7 days), default 300. For a link that never expires, use a Dynamic URL.'
                    detail: { field: expiresIn, min: 1, max: 604800, default: 300 }
                badWebhookUrl:
                  value:
                    error: WEBHOOK_URL_INVALID
                    message: 'webhookUrl: url must not target a private host'
                    detail: { field: webhookUrl, reason: url must not target a private host }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: An image or video in the template or in `modifications`, the audio track, or the subtitle file a `subtitles` URL points to could not be loaded (not public, not the right kind of file, or unreachable). No credits are charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                image:
                  value:
                    error: VALIDATION_ERROR
                    message: 'Image failed to load: https://example.com/missing.jpg. Check that the URL is public and points to an image. No credits were charged.'
                video:
                  value:
                    error: VALIDATION_ERROR
                    message: 'Video failed to load: https://example.com/missing.mp4. Check that the URL is public and points to a video. No credits were charged.'
                audio:
                  value:
                    error: VALIDATION_ERROR
                    message: 'Audio failed to load: https://example.com/missing.mp3 (the server answered HTTP 404). No credits were charged.'
                aiRefused:
                  summary: The AI provider refused a prompt (AI_BAD_REQUEST is also a 422)
                  value:
                    error: AI_CONTENT_REFUSED
                    message: The AI provider refused this request because of its content policy. No credits were charged.
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/RenderFailed' }
        '502':
          description: An AI layer or the translation failed upstream (`AI_BAD_OUTPUT`, `AI_UPSTREAM_ERROR`). No credits were charged; retrying is safe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                badOutput:
                  value:
                    error: AI_BAD_OUTPUT
                    message: The AI did not return a usable result. No credits were charged.
                    detail: { model: anthropic/claude-haiku-5.5 }
        '503':
          description: |
            The render needs AI and AI is not available on this server
            (`AI_UNAVAILABLE`). Send `"ai": { "onError": "fallback" }` to
            render the saved text and images instead. Or MP4 video is
            turned off on this server (`VIDEO_UNAVAILABLE`): render png,
            jpeg, webp or pdf. No credits were charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                unavailable:
                  value:
                    error: AI_UNAVAILABLE
                    message: AI features are not available on this server. No credits were charged.
                    detail: { reason: off }
                videoUnavailable:
                  value:
                    error: VIDEO_UNAVAILABLE
                    message: 'MP4 video is turned off on this server. Render png, jpeg, webp or pdf instead. No credits were charged.'
        '504':
          description: An AI layer or the translation took too long (`AI_TIMEOUT`). No credits were charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /render-jobs/{id}:
    get:
      tags: [Render]
      operationId: getRenderJob
      summary: Get a render job
      description: |
        A render job of the API key's workspace: an MP4 render, or a render
        sent with `"async": true`. Poll it (once a second is plenty) until
        `status` is `succeeded`, then read the files from `result`, the
        same object a synchronous render returns as `data`. A `failed` job
        carries the error a synchronous render would have answered, in
        `error`, and costs nothing.

        Every read answers fresh file links that work for the request's
        `expiresIn` (default 300 seconds) from then, until `expiresAt`, for
        as long as the files exist: they are deleted 8 days after the
        render.

        While a video renders, `progress` goes from 0 to 1 (frames
        captured out of the total).
      parameters:
        - in: path
          name: id
          required: true
          description: The `jobId` from the `202` answer of `POST /render`.
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: The render job.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/RenderJob' }
              examples:
                running:
                  value:
                    job:
                      id: clx8n0q1r0008abcd1234efgh
                      status: running
                      progress: 0.42
                      format: mp4
                      templateId: clx8m2k3p0004abcd1234efgh
                      createdAt: '2026-11-09T12:36:24.161Z'
                      startedAt: '2026-11-09T12:36:24.165Z'
                      finishedAt: null
                      result: null
                      error: null
                succeeded:
                  value:
                    job:
                      id: clx8n0q1r0008abcd1234efgh
                      status: succeeded
                      progress: 1
                      format: mp4
                      templateId: clx8m2k3p0004abcd1234efgh
                      createdAt: '2026-11-09T12:36:24.161Z'
                      startedAt: '2026-11-09T12:36:24.165Z'
                      finishedAt: '2026-11-09T12:36:38.786Z'
                      result:
                        content: https://cdn.jamframe.com/renders/ws_abc123/c724edf3-728c-4b57-8c31-4c2c0348ae6d.mp4?Expires=1794228100&Key-Pair-Id=K2JCJMDEHXQW5F&Signature=Yq0nRZ3x~Gd5WQ__
                        expiresAt: '2026-11-09T12:41:40.000Z'
                        type: url
                        format: mp4
                        pages: [1, 2]
                        credits: 13
                        renderId: clx8n0q1r0009abcd1234efgh
                        responseTime: 14604
                        duration: 13
                      error: null
                failed:
                  value:
                    job:
                      id: clx8n0q1r0010abcd1234efgh
                      status: failed
                      progress: 0
                      format: mp4
                      templateId: clx8m2k3p0004abcd1234efgh
                      createdAt: '2026-11-09T12:37:57.100Z'
                      startedAt: '2026-11-09T12:37:57.105Z'
                      finishedAt: '2026-11-09T12:37:57.264Z'
                      result: null
                      error:
                        error: VALIDATION_ERROR
                        message: 'Video failed to load: https://example.com/missing.mp4. Check that the URL is public and points to a video. No credits were charged.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No render job with this id in the API key's workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                error: NOT_FOUND
