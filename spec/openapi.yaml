        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /images/remove-background:
    post:
      tags: [AI]
      operationId: removeImageBackground
      summary: Remove an image's background
      description: |
        Cuts the subject out of a picture and stores the result in the API
        key's workspace brand library as a transparent PNG; `url` is ready
        for `modifications` (an image layer's parameter).

        The cut-out runs on our servers with U²-Net (`method: local`): the
        original pixels are kept at full size and only an alpha channel is
        added, with edges refined against the picture and logos on flat
        colours keyed out completely. Costs **1 AI credit**, refunded when
        it fails. A server without the local model uses an image model
        instead (`method: model`, **8 AI credits**), which redraws the
        subject, so small text can change.

        Send JSON with the picture's `url` (http(s); PNG, JPEG, GIF or WebP
        up to 10 MB) or a multipart upload in `file`. Pictures larger than
        4096 px a side are cut out at 4096 px, and a PNG over 10 MB is made
        smaller to fit (`scaled: true`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: The picture (http or https). }
                name: { type: string, maxLength: 120, description: 'Name for the new brand-library asset (default: "Image"), suffixed with "(no background)".' }
            example: { url: 'https://example.com/photos/product.jpg', name: Product shot }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string }
      responses:
        '200':
          description: The cut-out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackgroundRemoval' }
              example:
                url: https://cdn.jamframe.com/workspaces/ws_123/images/as_456.png
                width: 2537
                height: 1897
                method: local
                model: u2net
                scaled: false
                creditsCharged: 1
                asset:
                  id: as_456
                  kind: image
                  name: Product shot (no background)
                  url: https://cdn.jamframe.com/workspaces/ws_123/images/as_456.png
                  mimeType: image/png
                  size: 3663403
                  createdAt: '2026-11-10T09:12:00.000Z'
                  tags: [ai, cutout]
                  meta: { width: 2537, height: 1897 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Neither the local model nor an AI model is available on this server (`AI_UNAVAILABLE`, `detail.reason` `no_model`). No credits were charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: AI_UNAVAILABLE, message: 'Background removal is not set up on this server', detail: { reason: no_model } }

  /ai/transcribe:
    post:
      tags: [AI]
      operationId: transcribeMedia
      summary: Transcribe audio or video into subtitles
      description: |
        Transcribes the speech in an audio file or a video's soundtrack and
        splits it into subtitle cues: at most 2 lines of 42 characters,
        ending at sentence ends, pauses and commas, on screen 1–7 seconds
        (`style: short`: one line of up to 24 characters, for vertical
        social video). Returns the cues and the same as SRT and WebVTT:
        pass `cues` (or `srt`) as `modifications.subtitles` in an MP4
        render to burn them in.

        Costs **1 AI credit per minute** of audio transcribed, refunded when
        it fails. `start` and `duration` transcribe only a window of the
        file (seconds); `offset` moves the cues to where that window sits
        on your video's timeline. Files up to 100 MB and 2 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscribeRequest' }
            example: { url: 'https://example.com/audio/voiceover.mp3', language: en }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                language: { type: string }
                style: { type: string, enum: [standard, short] }
                start: { type: number }
                duration: { type: number }
                offset: { type: number }
      responses:
        '200':
          description: The transcript as subtitle cues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcription' }
              example:
                language: en
                duration: 6.4
                text: Meet Aurora One, our new wireless speaker. It fills any room.
                cues:
                  - { start: 0.4, end: 3.3, text: 'Meet Aurora One, our new wireless speaker.' }
                  - { start: 3.5, end: 5.2, text: 'It fills any room.' }
                srt: "1\n00:00:00,400 --> 00:00:03,300\nMeet Aurora One, our new wireless speaker.\n\n2\n00:00:03,500 --> 00:00:05,200\nIt fills any room.\n"
                vtt: "WEBVTT\n\n00:00:00.400 --> 00:00:03.300\nMeet Aurora One, our new wireless speaker.\n\n00:00:03.500 --> 00:00:05.200\nIt fills any room.\n"
                creditsCharged: 1
                model: openai/whisper-large-v3-turbo
                mock: false
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: The speech-to-text provider failed (`AI_UPSTREAM_ERROR`) or answered unusably (`AI_BAD_OUTPUT`). No credits were charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: AI_UPSTREAM_ERROR, message: 'The AI provider failed: try again' }
        '503':
          description: AI is not available on this server (`AI_UNAVAILABLE`). No credits were charged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: AI_UNAVAILABLE, message: AI features are not available on this server, detail: { reason: no_key } }

  /r/s/{token}:
    servers:
      - url: https://api.jamframe.com
        description: Production
      - url: http://localhost:3100
        description: Local development
    get:
      tags: [Public URLs]
      operationId: openSignedUrl
      summary: Open a signed URL
      security: []
      description: |
        The URL returned by `POST /signed-urls`: `<kid>.<payload>.<sig>.<ext>`.
        Renders the signed request (or serves it from the render cache) and
        answers with the file. No authentication: the signature is the
        credential. A query string is ignored.

        Cache: within the URL's cache time, the same request is served from
        the stored file for free, and `If-None-Match` with the `ETag`
        answers `304`. `X-Render-Cache` says `HIT` or `MISS`.
        `Cache-Control: max-age` is the cache time but at most one day, so a
        key rotation reaches browsers and CDNs within a day.

        `HEAD` answers from the render cache only and never renders or
        charges: a cached request gets the headers a `GET` would, anything
        else `200` with `X-Render-Cache: MISS` and `Cache-Control: no-store`.
      parameters:
        - in: path
          name: token
          required: true
          description: The signed token, ending in `.png`, `.jpg`, `.webp` or `.pdf`.
          schema: { type: string, maxLength: 6000 }
      responses:
        '200': { $ref: '#/components/responses/RenderedFile' }
        '304':
          description: The `If-None-Match` ETag is current.
        '400': { $ref: '#/components/responses/PublicError' }
        '402': { $ref: '#/components/responses/PublicError' }
        '403': { $ref: '#/components/responses/PublicError' }
        '404': { $ref: '#/components/responses/PublicError' }
        '410': { $ref: '#/components/responses/PublicError' }
        '422': { $ref: '#/components/responses/PublicError' }
        '429': { $ref: '#/components/responses/PublicError' }
        '500': { $ref: '#/components/responses/PublicError' }
        '503': { $ref: '#/components/responses/PublicError' }

  /r/d/{file}:
    servers:
      - url: https://api.jamframe.com
        description: Production
      - url: http://localhost:3100
        description: Local development
    get:
      tags: [Public URLs]
      operationId: openDynamicUrl
      summary: Open a dynamic URL
      security: []
      description: |
        A template's dynamic URL, switched on in the app's Integrations, API
        & Forms dialog:
        `/r/d/<publicId>.<ext>?key=value&…`. Every query parameter is a
        modification, as in `POST /render` (`headline`, `page2@headline`,
        `headline.color`); values are URL-decoded. Names starting with `_`
        are reserved: `_page` picks the page of an image (default 1) or the
        pages of a PDF (`1,3`), `_scale` is 1, 2 or 3, `_size` is a Smart
        Resize target (a size id, a size name or `WIDTHxHEIGHT`); any other
        `_name` is ignored. At most 50 parameters, names up to 200 and values up to
        2000 characters, 8000 characters in all; a repeated name is a `400`.

        A render costs credits like any other (1 per image, or per PDF
        page) and counts toward the URL's credit cap. Within the URL's cache
        time (default 300 seconds) the same parameters are served from the
        stored file: free, not counted toward the cap, and still served
        once the cap is reached. Parameters that match nothing in the
        template don't change the cache key.

        When the cap is reached (`402 CREDIT_CAP_REACHED`, for parameters
        not in the cache), the URL is turned off (`410 URL_DISABLED`) or
        has expired (`410 URL_EXPIRED`), the answer is a JSON error, not an
        image. A new dynamic URL starts with a 100-credit cap (change or
        remove it in the app). `Cache-Control: max-age` is the cache
        time but at most one hour, so turning the URL off or making a new
        link reaches browsers and CDNs within the hour.

        Output size: at most 20 megapixels per page (width × height ×
        `_scale`²; `PUBLIC_RENDER_MAX_PIXELS` on self-hosted servers), a
        `400` above that. `HEAD` answers from the render cache only, as for
        signed URLs: it never renders or charges.
      parameters:
        - in: path
          name: file
          required: true
          description: The URL's public id and the format, e.g. `Q2x5a1RqZmVt0GZ4aWw.png` (`png`, `jpg`, `jpeg`, `webp` or `pdf`).
          schema: { type: string }
        - in: query
          name: modifications
          required: false
          style: form
          explode: true
          description: Any number of `key=value` pairs, each a modification.
          schema:
            type: object
            additionalProperties: { type: string }
          example: { headline: Hello world, headline.color: '#FF0000' }
      responses:
        '200': { $ref: '#/components/responses/RenderedFile' }
        '304':
          description: The `If-None-Match` ETag is current.
        '400': { $ref: '#/components/responses/PublicError' }
        '402': { $ref: '#/components/responses/PublicError' }
        '403': { $ref: '#/components/responses/PublicError' }
        '404': { $ref: '#/components/responses/PublicError' }
        '410': { $ref: '#/components/responses/PublicError' }
        '422': { $ref: '#/components/responses/PublicError' }
        '429': { $ref: '#/components/responses/PublicError' }
        '500': { $ref: '#/components/responses/PublicError' }
        '503': { $ref: '#/components/responses/PublicError' }

  /api/public/forms/{publicId}:
    servers:
      - url: https://app.jamframe.com
        description: Production (placeholder until the domain is final)
      - url: http://localhost:3100
        description: Local development
    get:
      tags: [Public forms]
      operationId: getPublicForm
      summary: Get a public form
      security: []
      description: |
        The form's visible fields, output and branding, and the template
        data its live preview draws: the output's pages at the output size,
        without editor-only layer fields (names, locks, animations), the
        placeholder values those pages use and the fonts. Nothing else of
        the template or its owner. A form at its credit cap still answers
        (`status: cap_reached`) so the page can say so.
      parameters:
        - $ref: '#/components/parameters/FormPublicId'
      responses:
        '200':
          description: The form.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicForm' }
        '403': { $ref: '#/components/responses/PublicFormFailure' }
        '404': { $ref: '#/components/responses/PublicFormFailure' }
        '410': { $ref: '#/components/responses/PublicFormFailure' }
        '429': { $ref: '#/components/responses/PublicFormFailure' }

  /api/public/forms/{publicId}/render:
    servers:
      - url: https://app.jamframe.com
        description: Production (placeholder until the domain is final)
      - url: http://localhost:3100
        description: Local development
    post:
      tags: [Public forms]
      operationId: renderPublicForm
      summary: Render a public form
      security: []
      description: |
        Render the template with the visitor's answers, keyed by field
        (`key` in `GET /api/public/forms/{publicId}`). Text is trimmed (line
        breaks kept only in long text), colours are `#rrggbb`, image and
        file fields take a public `https://` URL or, for upload fields, the
        `url` of an upload of this form. An empty optional answer keeps the
        template's value; keys that are not visible fields are ignored.

        Costs 1 credit per page rendered, charged to the form owner and
        counted toward the form's credit cap (in the same transaction, so
        concurrent submissions can't overshoot it). The same answers again
        within an hour are served from the render cache for free; the
        response doesn't say so (nor which render it was), so a visitor
        can't tell that someone else sent the same answers. Output size is
        capped at 20 megapixels per page like the other public renders. A
        body that isn't JSON is `400 INVALID_REQUEST`; one over 256 kB is
        `413 BODY_TOO_LARGE`.
      parameters:
        - $ref: '#/components/parameters/FormPublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicFormRenderRequest' }
            example:
              values: { headline: Grand opening, photo: 'https://example.com/shop.jpg' }
              turnstileToken: 0.AbC…
      responses:
        '200':
          description: The render's files.
          content:
            application/json:
              schema:
                type: object
                required: [render]
                properties:
                  render: { $ref: '#/components/schemas/PublicFormRender' }
        '400': { $ref: '#/components/responses/PublicFormFailure' }
        '402': { $ref: '#/components/responses/PublicFormFailure' }
        '403': { $ref: '#/components/responses/PublicFormFailure' }
        '404': { $ref: '#/components/responses/PublicFormFailure' }
        '410': { $ref: '#/components/responses/PublicFormFailure' }
        '413': { $ref: '#/components/responses/PublicFormFailure' }
        '415': { $ref: '#/components/responses/PublicFormFailure' }
        '422': { $ref: '#/components/responses/PublicFormFailure' }
        '429': { $ref: '#/components/responses/PublicFormFailure' }
        '500': { $ref: '#/components/responses/PublicFormFailure' }
        '503': { $ref: '#/components/responses/PublicFormFailure' }

  /api/public/forms/{publicId}/uploads:
    servers:
      - url: https://app.jamframe.com
        description: Production (placeholder until the domain is final)
      - url: http://localhost:3100
        description: Local development
    post:
      tags: [Public forms]
      operationId: uploadToPublicForm
      summary: Upload an image to a public form
      security: []
      description: |
        Upload an image for an upload field, then send its `url` as that
        field's answer. PNG, JPEG, WebP or GIF, decided from the file's
        bytes (SVG and anything else is refused), at most 10 MB, 10,000 px a
        side and 40 megapixels. Uploads are kept 24 hours, then deleted;
        they never appear in the owner's brand library.

        Accepted only while the form could render (on, unexpired, room under
        its credit cap for one more render, credits left in the owner's
        account; `402` otherwise), and with a bot check: a Turnstile token
        in `X-Turnstile-Token`, which earns an `uploadPass` in the response,
        or that pass in `X-Upload-Pass` for the visit's next uploads (10
        within 30 minutes). At most 500 live uploads per form.
      parameters:
        - $ref: '#/components/parameters/FormPublicId'
        - in: query
          name: field
          required: true
          description: The key of an upload field of the form.
          schema: { type: string }
        - in: header
          name: X-Turnstile-Token
          required: false
          description: A Turnstile token, when there is no upload pass yet (or it ran out).
          schema: { type: string }
        - in: header
          name: X-Upload-Pass
          required: false
          description: The `uploadPass.pass` an earlier upload of this visit returned.
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The stored upload.
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload: { $ref: '#/components/schemas/PublicFormUpload' }
                  uploadPass:
                    type: object
                    required: [pass, expiresAt]
                    description: Only when this upload spent a Turnstile token. Send `pass` as `X-Upload-Pass` with the visit's next uploads.
                    properties:
                      pass: { type: string }
                      expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/PublicFormFailure' }
        '402': { $ref: '#/components/responses/PublicFormFailure' }
        '403': { $ref: '#/components/responses/PublicFormFailure' }
        '404': { $ref: '#/components/responses/PublicFormFailure' }
        '410': { $ref: '#/components/responses/PublicFormFailure' }
        '413': { $ref: '#/components/responses/PublicFormFailure' }
        '429': { $ref: '#/components/responses/PublicFormFailure' }
        '503': { $ref: '#/components/responses/PublicFormFailure' }

  /api/public/forms/{publicId}/files/{handle}:
    servers:
      - url: https://app.jamframe.com
        description: Production (placeholder until the domain is final)
      - url: http://localhost:3100
        description: Local development
    get:
      tags: [Public forms]
      operationId: getPublicFormFile
      summary: Get a public form's result file
      security: []
      description: |
        A file of a render made through this form, by the handle in its
        `url` / `downloadUrl` (render response). Shown inline; with
        `download=1`, as an attachment named after the form. Handles are
        opaque, made afresh for each response and only valid on this form.
        Files are deleted 7 days after the render (`410 FILE_EXPIRED`).
      parameters:
        - $ref: '#/components/parameters/FormPublicId'
        - in: path
          name: handle
          required: true
          schema: { type: string }
        - in: query
          name: download
          required: false
          description: '`1`: `Content-Disposition: attachment`.'
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition:
              description: '`inline` (or `attachment` with `download=1`) and a file name from the form''s title.'
              schema: { type: string }
            Cache-Control:
              description: '`private, max-age=3600`.'
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/PublicFormFailure' }
        '404': { $ref: '#/components/responses/PublicFormFailure' }
        '410': { $ref: '#/components/responses/PublicFormFailure' }
        '429': { $ref: '#/components/responses/PublicFormFailure' }

