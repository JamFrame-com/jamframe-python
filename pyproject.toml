[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jamframe"
version = "0.1.0"
description = "Python client for the JamFrame API: render templates to images, carousels, PDFs and videos, design templates with AI, run workflows and post to social accounts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alphacloud Technologies Pte Ltd", email = "hello@jamframe.com" }]
keywords = ["jamframe", "image generation", "templates", "carousel", "pdf", "video", "social media", "api client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.5", "pyyaml>=6"]

[project.urls]
Homepage = "https://jamframe.com/"
Documentation = "https://app.jamframe.com/docs/api"
Repository = "https://github.com/JamFrame-com/jamframe-python"
Issues = "https://github.com/JamFrame-com/jamframe-python/issues"
Changelog = "https://github.com/JamFrame-com/jamframe-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jamframe"]

[tool.hatch.build.targets.sdist]
include = ["src/jamframe", "tests", "spec", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
files = ["src/jamframe"]
