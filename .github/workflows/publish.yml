# Publishes the package when a version tag (0.1.0, 1.2.3, …) is pushed:
# first to TestPyPI, then to PyPI.
#
# Both use PyPI trusted publishing: PyPI trusts this workflow in this
# repository, so no token is stored anywhere. Each site has a trusted (or,
# before the first upload, "pending") publisher for this repository,
# workflow publish.yml and environment `testpypi` / `pypi`. Give the `pypi`
# environment a required reviewer (Settings → Environments) so each release
# waits on TestPyPI until someone approves it.

name: Publish

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version" >&2
            exit 1
          fi
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run mypy
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/jamframe/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jamframe/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
